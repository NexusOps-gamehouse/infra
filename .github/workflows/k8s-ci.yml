name: infra-k8s-ci

# k8s 매니페스트 검증 전용. 배포 job 은 없다.
#
# ci-cd.yml 과 분리한 이유:
#   1. ci-cd.yml 의 paths 에 k8s/** 를 넣으면 매니페스트만 고쳐도
#      deploy job 이 EC2 에 SSM 으로 붙어 compose 스택을 재배포한다.
#      paths 는 워크플로우 레벨이라 job 별로 나눌 수 없다.
#   2. 이 파일은 secret 을 하나도 쓰지 않는다. 권한이 contents: read 로 끝난다.
#   3. ArgoCD 를 붙이면 push 기반 배포(ci-cd.yml 의 deploy)는 사라지지만
#      이 검증은 그대로 남는다. 오히려 그때는 git 머지가 곧 배포라서
#      PR 시점의 이 검사가 유일한 게이트가 된다.

on:

  pull_request:
    branches:
      - develop
      - main

    paths:
      - 'k8s/**'
      - '.github/workflows/k8s-ci.yml'

  push:
    branches:
      - develop
      - main

    paths:
      - 'k8s/**'
      - '.github/workflows/k8s-ci.yml'


concurrency:

  # group 의 github.workflow 는 위 name 값이다.
  # ci-cd.yml(infra-ci-cd)과 이름이 다르므로 서로를 취소하지 않는다.
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true


permissions:

  contents: read


env:

  # ArgoCD 가 렌더링에 쓰는 kustomize 와 버전이 어긋나면 CI 는 통과했는데
  # 클러스터에는 다른 결과가 적용될 수 있다. 둘을 같은 버전으로 맞춘다.
  KUSTOMIZE_VERSION: '5.7.1'

  KUBECONFORM_VERSION: '0.6.7'

  # 검증 기준이 되는 쿠버네티스 버전. 이 버전의 스키마 세트로만 검사하므로,
  # 해당 버전에서 제거된 API 를 쓰면 여기서 걸린다.
  #
  # ⚠️ 이 값은 아직 실제 클러스터에서 확인된 값이 아니다.
  #    출처는 이전 작업 문서 한 줄뿐이다(task/k8s/v1/k8s/README.md).
  #    현재 레포에 클러스터 IaC(terraform/eksctl)가 없어 맞춰볼 대상 자체가 없다.
  #
  # ⚠️ 어긋나는 방향에 따라 위험도가 다르다.
  #      CI < 클러스터 : 그 사이 버전에서 제거된 API 를 못 잡는다. 검증이 조용히
  #                      무력해지므로 이쪽이 위험하다.
  #      CI > 클러스터 : 클러스터에 없는 필드를 통과시킨다.
  #
  # TODO(EKS 생성 시): 실제 클러스터 버전으로 맞추고, IaC 가 생기면 거기 선언된
  #                    버전을 CI 가 읽어 쓰도록 바꾼다. 그래야 드리프트가 구조적으로
  #                    불가능해진다. 클러스터를 업그레이드할 때는 이 값을 먼저 올려
  #                    CI 를 돌려보면 깨질 매니페스트를 미리 알 수 있다.
  K8S_VERSION: '1.29.0'


jobs:

  # ===============================================================
  # RENDER
  #
  # 오버레이 3벌을 각각 렌더링해 스키마 검증한다.
  # 오버레이마다 components/patches 조합이 달라 한 벌만 통과해도
  # 나머지가 깨져 있을 수 있으므로 매트릭스로 전부 돈다.
  # ===============================================================

  render:

    name: render (${{ matrix.overlay }})

    runs-on: ubuntu-latest

    timeout-minutes: 10

    strategy:

      # 하나가 깨져도 나머지 결과를 봐야 원인 범위를 좁힐 수 있다.
      fail-fast: false

      matrix:
        overlay:
          - local
          - dev
          - prod


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------------------------------------------
      # 도구 설치
      #
      # 둘 다 버전을 고정한다. 재현성 문제도 있지만, 그보다
      # kustomize 가 올라가면서 렌더링 결과가 조용히 바뀌는 쪽이 위험하다.
      # -------------------------------------------------------------

      - name: Install kustomize
        run: |

          curl -sSfL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize

          kustomize version


      - name: Install kubeconform
        run: |

          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

          kubeconform -v


      # -------------------------------------------------------------
      # 렌더링
      #
      # 여기서 실패하는 건 대부분 patch target 오타나 resources 경로다.
      # -------------------------------------------------------------

      - name: Build overlay
        run: |

          mkdir -p rendered

          kustomize build "k8s/overlays/${{ matrix.overlay }}" \
            > "rendered/${{ matrix.overlay }}.yaml"

          echo "rendered $(grep -c '^---' rendered/${{ matrix.overlay }}.yaml) documents"


      # -------------------------------------------------------------
      # 스키마 검증
      #
      # -strict: 스키마에 없는 필드를 오류로 본다. 오타난 키가
      #          조용히 무시되는 것을 막는다(예: requsts, tolerations 오타).
      #
      # ExternalSecret / ClusterSecretStore 는 CRD 라 내장 스키마에 없다.
      # datreeio/CRDs-catalog 에서 external-secrets.io 스키마를 받아 검증한다.
      # -ignore-missing-schemas 를 쓰면 검증이 조용히 건너뛰어지므로 쓰지 않는다.
      # 카탈로그가 404 를 내면 그것도 알아야 한다.
      # -------------------------------------------------------------

      - name: Validate schemas (kubeconform)
        run: |

          kubeconform \
            -strict \
            -summary \
            -kubernetes-version "${K8S_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "rendered/${{ matrix.overlay }}.yaml"


      # -------------------------------------------------------------
      # 렌더링 결과 자체에 대한 검사
      #
      # kubeconform 은 "스키마에 맞는가"만 본다. 아래는 스키마상으로는
      # 멀쩡하지만 배포하면 터지는 것들이다.
      # -------------------------------------------------------------

      - name: Assert rendered output
        env:
          OVERLAY: ${{ matrix.overlay }}
        run: |

          R="rendered/${OVERLAY}.yaml"
          fail=0

          # (1) 논리 이미지 이름이 치환되지 않고 남은 경우.
          #
          # base 는 gamehouse-user:OVERLAY_MUST_SET 같은 논리 이름을 쓰고
          # 오버레이의 images: 가 실제 좌표로 바꾼다. 오버레이가 항목을
          # 빠뜨리면 이 문자열이 그대로 남아 ImagePullBackOff 가 된다.
          if grep -n 'OVERLAY_MUST_SET' "$R"; then

            echo "::error::${OVERLAY}: images: 트랜스포머가 치환하지 않은 논리 이름이 남았다"
            fail=1

          fi

          # (2) local 오버레이에 배포 시 치환용 자리표시자가 남은 경우.
          #
          # dev/prod 는 CI 가 커밋 SHA 를 박기 전이라 REPLACE_AT_DEPLOY 가
          # 남아 있는 것이 정상이다. local 은 kind 에 바로 올리므로 아니다.
          if [ "$OVERLAY" = 'local' ] && grep -n 'REPLACE_AT_DEPLOY' "$R"; then

            echo "::error::local: REPLACE_AT_DEPLOY 는 local 오버레이에 있으면 안 된다"
            fail=1

          fi

          # (3) 이미지 중복 — images: 트랜스포머 덮어쓰기 탐지.
          #
          # base 가 논리 이름 대신 실제 레포명(nexusops0713/gamehouse)을 쓰면
          # 서비스 4개의 매칭 이름이 전부 같아져, images: 항목 하나가 나머지를
          # 덮어쓴다. kustomize 는 경고도 에러도 내지 않는다.
          # 서비스마다 이미지가 달라야 하므로 중복이 곧 이 사고다.
          dup=$(

            grep -E '^[[:space:]]+image:' "$R" \
              | sed 's/^[[:space:]]*image:[[:space:]]*//' \
              | sort \
              | uniq -d

          )

          if [ -n "$dup" ]; then

            echo "::error::${OVERLAY}: 여러 워크로드가 같은 이미지를 가리킨다 (images: 덮어쓰기 의심)"
            echo "$dup"
            fail=1

          fi

          # (4) :latest 태그.
          #
          # 무엇이 돌고 있는지 알 수 없어지고 롤백도 불가능하다.
          lat=$(grep -E '^[[:space:]]+image:.*:latest[[:space:]]*$' "$R" || true)

          if [ -n "$lat" ]; then

            echo "::error::${OVERLAY}: :latest 태그는 사용하지 않는다"
            echo "$lat"
            fail=1

          fi

          if [ "$fail" -eq 0 ]; then

            echo "assertions OK (${OVERLAY})"

          fi

          exit "$fail"


      # -------------------------------------------------------------
      # 렌더링 결과 보관
      #
      # PR 리뷰에서 "이 patch 가 실제로 어떻게 반영됐는지"를 보려면
      # 렌더링 결과가 필요하다. 매니페스트 리뷰는 소스만 봐서는 어렵다.
      # -------------------------------------------------------------

      - name: Upload rendered manifest
        # 검증이 실패했을 때야말로 결과물을 봐야 한다.
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: rendered-${{ matrix.overlay }}
          path: rendered/${{ matrix.overlay }}.yaml
          retention-days: 7


  # ===============================================================
  # SECRET SCAN
  #
  # ci-cd.yml 에도 gitleaks 가 있지만 그쪽 paths 에 k8s/** 가 없어서,
  # 매니페스트만 바뀐 커밋은 스캔 없이 통과한다.
  # base 와 overlays/local 에 Secret 매니페스트가 평문으로 들어 있으므로
  # (현재는 CHANGE_ME 자리표시자) 이 자리가 필요하다.
  # ===============================================================

  secret-scan:

    name: secret scan (gitleaks)

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Secret scan (gitleaks)
        run: |

          docker run \
            --rm \
            -v "${PWD}:/repo" \
            zricethezav/gitleaks:v8.18.4 \
            detect \
            --source=/repo \
            --no-git \
            --redact \
            --verbose
