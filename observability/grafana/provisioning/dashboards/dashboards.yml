# ---------------------------------------------------------------------------
# 이 디렉터리의 *.json 을 Grafana 가 시작 시 자동으로 불러온다.
#
# 덕분에 dashboard 를 사람이 클릭해서 만드는 대신 코드로 관리할 수 있다.
# 로컬에서 만든 dashboard 를 JSON Model 로 export 해 여기에 커밋하면,
# 어느 호스트에서 띄우든 같은 화면이 뜬다.
#
# export 시 주의: JSON 최상단의 "id" 는 null 로 바꾸고 "uid" 는 유지한다.
# ---------------------------------------------------------------------------
apiVersion: 1

providers:
  - name: gamehouse
    orgId: 1
    folder: gamehouse
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
