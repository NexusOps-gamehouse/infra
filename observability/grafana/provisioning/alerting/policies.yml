apiVersion: 1

# ---------------------------------------------------------------------------
# 어떤 알림을 누구에게, 얼마나 자주 보낼 것인가 (Notification policy)
#
# ⚠️ 여기에 정책을 두면 Grafana 기본 정책을 덮어쓴다. UI 에서 수정할 수 없게 되므로
#    바꾸려면 이 파일을 고치고 컨테이너를 다시 만들어야 한다.
#
# 세 값의 의미
#   group_wait      첫 알림을 보내기 전 기다리는 시간. 같은 사고로 여러 알람이
#                   연달아 뜰 때(예: EC2 부하 → backend down + 메모리 부족)
#                   한 번에 묶어 보내기 위한 것
#   group_interval  이미 알린 그룹에 새 알람이 추가됐을 때 다시 보내는 간격
#   repeat_interval 상황이 그대로일 때 다시 알리는 간격. 짧으면 소음, 길면 잊는다
# ---------------------------------------------------------------------------
policies:
  - orgId: 1
    receiver: discord
    # alertname 별로 묶는다. job 라벨은 묶음에서 빼서 backend 와 rabbitmq 가
    # 동시에 죽으면 메시지 하나에 둘 다 들어오게 한다.
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

    routes:
      # Riot 키 만료는 예외로 뺀다.
      #
      # 개발용 키가 24시간마다 만료되므로 이 알람은 사실상 매일 울린다.
      # 다른 critical 과 같이 1시간마다 반복하면 하루에 몇 번씩 같은 알림이 오고,
      # 그러다 Discord 알림을 통째로 꺼버리게 된다. 알람을 무력화하는 가장 흔한 경로다.
      #
      # 처음 한 번은 바로 알리되(group_wait 30s), 반복은 6시간으로 늦춘다.
      # 대응(키 재발급 + 재배포)에 10분이면 충분하므로 6시간이면 잊을 일이 없다.
      #
      # ⚠️ routes 는 위에서부터 먼저 맞는 것 하나만 적용된다. 그래서 이 항목이
      #    아래 severity=critical 규칙보다 위에 있어야 한다. 순서를 바꾸면 무시된다.
      - receiver: discord
        object_matchers:
          - ['alertname', '=', 'Riot API 키 만료']
        group_wait: 30s
        group_interval: 30m
        repeat_interval: 6h

      # 즉시 대응이 필요한 것. 그대로 두면 1시간마다 다시 알린다.
      - receiver: discord
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h

      # 관측 스택 저하 등. 서비스는 정상이므로 하루 한 번이면 충분하다.
      - receiver: discord
        object_matchers:
          - ['severity', '=', 'warning']
        group_wait: 5m
        group_interval: 30m
        repeat_interval: 24h
