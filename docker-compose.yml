name: gamehouse

services:
  db:
    image: postgres:16-alpine
    container_name: gamehouse-db
    environment:
      POSTGRES_DB: ${DB_NAME:-duo}
      POSTGRES_USER: ${DB_USERNAME:-duo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - duo-db-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5

  # 채팅 메시지 전달을 위한 외부 STOMP 브로커.
  # db 와 마찬가지로 backend 만 접근하는 내부 인프라이므로 backend-net 에만 연결한다.
  rabbitmq:
    build: ../infra/rabbitmq        # STOMP 플러그인을 켠 커스텀 이미지
    container_name: gamehouse-rabbitmq
    environment:
      # guest/guest 는 localhost 외부 접속이 막혀 있어 전용 계정을 만든다.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "15672:15672"   # 관리 UI (로컬 디버깅용). STOMP(61613)는 컨테이너 간 통신이라 노출 불필요
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ../backend
    image: nexusops0713/gamehouse:backend-${BACKEND_VERSION:-develop}
    # CI가 linux/amd64로만 빌드한다. Apple Silicon(arm64) 맥에서
    # 이 지정이 없으면 `no matching manifest for linux/arm64/v8` 로 실패한다.
    # 맥에서는 Rosetta 에뮬레이션으로 돌아 기동이 느린 것이 정상이다.
    platform: linux/amd64
    # up 할 때마다 registry를 확인한다.
    # develop 태그는 같은 이름에 계속 덮어써지므로(mutable),
    # 이게 없으면 로컬에 캐시된 옛 이미지를 그대로 재사용해 배포가 반영되지 않는다.
    # 로컬에서 소스로 빌드해 띄우려면 `docker compose up -d --build` 를 쓴다.
    pull_policy: always
    container_name: gamehouse-backend
    # t3.small(2GiB)에서 관찰 스택까지 얹으므로 컨테이너별 상한을 명시한다.
    # 한계가 없으면 OOM killer 가 "가장 큰 프로세스" = 이 JVM 을 골라 죽인다.
    mem_limit: 700m
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # ---- 메모리 상한 ------------------------------------------------------
      # 측정값(로컬, 유휴 상태): RSS 565MB = 힙 87 + 비힙 158 + 미추적 네이티브 321
      # 미추적분이 가장 크고, 그중 상당량이 스레드 스택(121개)과 glibc 메모리 풀이다.
      #
      # glibc 는 스레드마다 메모리 풀(arena)을 만들어 RSS 를 부풀린다.
      # 컨테이너 자바에서 잘 알려진 현상으로, 2 로 제한하면 보통 50~100MB 줄어든다.
      MALLOC_ARENA_MAX: "2"
      #
      # Dockerfile 의 ENTRYPOINT 가 exec form(["java","-jar",...])이라 명령줄에
      # JVM 옵션을 끼워 넣을 수 없다. JAVA_TOOL_OPTIONS 는 JVM 이 기동 시 자동으로
      # 읽는 환경변수라, 이미지를 다시 만들지 않고 옵션을 주입할 수 있다.
      # 적용되면 기동 로그에 "Picked up JAVA_TOOL_OPTIONS: ..." 가 찍힌다.
      #
      #   -Xmx200m                  : 미지정 시 JVM 은 mem_limit 의 25%(=175m)를
      #                               힙 최대치로 잡는다. 현재 committed 가 87m 이므로
      #                               2배 여유를 두되 무제한 성장은 막는다.
      #   -Xss512k                  : 스레드당 스택 1MB → 512KB. 스레드가 121개라 체감이 크다.
      #   -XX:MaxDirectMemorySize   : 미지정 시 기본값이 -Xmx 와 같다. WebFlux(netty)가
      #                               Direct 버퍼를 쓰므로 별도로 천장을 씌운다.
      #
      # MaxMetaspaceSize 는 일부러 넣지 않았다. 비힙이 아직 JIT 워밍업으로 상승 중이라
      # 안정된 값을 확인한 뒤에 정하는 것이 맞다.
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:MaxDirectMemorySize=64m"
      # ----------------------------------------------------------------------
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-duo}
      DB_USERNAME: ${DB_USERNAME:-duo}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /app/uploads
      RIOT_API_KEY: ${RIOT_API_KEY:?RIOT_API_KEY is required}
      # RabbitMQ STOMP 릴레이 접속 정보. host 는 compose 네트워크상의 서비스명.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_STOMP_PORT: 61613
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - frontend-net
      - backend-net
    ports:
      - "8080:8080" 
        - "127.0.0.1:8081:8081"  # 로컬 디버깅용
    healthcheck:
      # 런타임 이미지에 curl 없음 → bash 로 포트 TCP 체크
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build: ../frontend
    image: nexusops0713/gamehouse:frontend-${FRONTEND_VERSION:-develop}
    # backend와 동일. 상세 설명은 backend 쪽 주석 참고.
    platform: linux/amd64
    pull_policy: always
    container_name: gamehouse-frontend
    depends_on:
      backend:
        condition: service_healthy
    # 런타임 주입 → entrypoint 가 dist/config.js 생성.
    # 기본값은 "비움" = 상대경로(/api,/ws) = ALB same-origin. 운영에서 env 를 안 줘도 안전한 값.
    # 로컬은 serve 에 프록시가 없어 절대 URL 이 필요하므로 .env(.env.example) 에서 명시적으로 채운다.
    #   (안 채우면 상대경로가 :5173 로 가 깨진다 → .env.example 의 FRONTEND_* 참고)
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-}
      WS_URL: ${FRONTEND_WS_URL:-}
      BACKEND_ORIGIN: ${FRONTEND_BACKEND_ORIGIN:-}
    networks:
      - frontend-net
    ports:
      - "5173:5173"
    healthcheck:
      # localhost 는 컨테이너 내부에서 IPv6(::1)로 풀릴 수 있어 서버(IPv4)와 안 붙음 → 127.0.0.1
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# frontend-net: frontend↔backend / backend-net: backend↔db,rabbitmq (내부 인프라 격리)
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  duo-db-data:
  backend-uploads:
  rabbitmq-data:
