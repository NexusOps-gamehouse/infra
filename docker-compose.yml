name: gamehouse

services:
  db:
    image: postgres:16-alpine
    container_name: gamehouse-db
    environment:
      POSTGRES_DB: ${DB_NAME:-duo}
      POSTGRES_USER: ${DB_USERNAME:-duo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - duo-db-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ../backend
    image: nexusops0713/gamehouse:backend-${BACKEND_VERSION:-develop}
    # CI가 linux/amd64로만 빌드한다. Apple Silicon(arm64) 맥에서
    # 이 지정이 없으면 `no matching manifest for linux/arm64/v8` 로 실패한다.
    # 맥에서는 Rosetta 에뮬레이션으로 돌아 기동이 느린 것이 정상이다.
    platform: linux/amd64
    # up 할 때마다 registry를 확인한다.
    # develop 태그는 같은 이름에 계속 덮어써지므로(mutable),
    # 이게 없으면 로컬에 캐시된 옛 이미지를 그대로 재사용해 배포가 반영되지 않는다.
    # 로컬에서 소스로 빌드해 띄우려면 `docker compose up -d --build` 를 쓴다.
    pull_policy: always
    container_name: gamehouse-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-duo}
      DB_USERNAME: ${DB_USERNAME:-duo}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      UPLOAD_DIR: /app/uploads
      RIOT_API_KEY: ${RIOT_API_KEY:?RIOT_API_KEY is required}
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - frontend-net
      - backend-net
    ports:
      - "8080:8080"   # 로컬 디버깅용
    healthcheck:
      # 런타임 이미지에 curl 없음 → bash 로 포트 TCP 체크
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build: ../frontend
    image: nexusops0713/gamehouse:frontend-${FRONTEND_VERSION:-develop}
    # backend와 동일. 상세 설명은 backend 쪽 주석 참고.
    platform: linux/amd64
    pull_policy: always
    container_name: gamehouse-frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net
    ports:
      - "80:80"
    healthcheck:
      # localhost 는 컨테이너 내부에서 IPv6(::1)로 풀려 nginx(IPv4)와 안 붙음 → 127.0.0.1
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# frontend-net: frontend↔backend / backend-net: backend↔db (db 격리)
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  duo-db-data:
  backend-uploads:
