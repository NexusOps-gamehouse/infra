name: gamehouse

services:
  # 채팅 메시지 전달을 위한 외부 STOMP 브로커.
  # backend 만 접근하는 내부 인프라이므로 backend-net 에만 연결한다.
  rabbitmq:
    build: ../infra/rabbitmq        # STOMP 플러그인을 켠 커스텀 이미지
    container_name: gamehouse-rabbitmq
    environment:
      # guest/guest 는 localhost 외부 접속이 막혀 있어 전용 계정을 만든다.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    #ports 삭제함 / 어차피 networks : backend-net으로 내부통신은 가능해서 외부에서 접속할 필요 없어보여서 일단 제거 
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  user:
    build:
      context: ../backend
      dockerfile: user/Dockerfile
    image: nexusops0713/gamehouse:user-${BACKEND_VERSION:-develop}
    platform: linux/amd64
    pull_policy: always
    mem_limit: 700m
    depends_on:
      rabbitmq:
        condition: service_healthy
      riot:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=user_svc
      USER_DB_USERNAME: ${DB_USERNAME:-duo}
      USER_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /app/uploads
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_AMQP_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      USER_SERVICE_URL: http://user:8081
      POST_SERVICE_URL: http://post:8082
      CHAT_SERVICE_URL: http://chat:8083
      RIOT_SERVICE_URL: http://riot:8084
      MATCH_SERVICE_URL: http://match:8085
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - frontend-net
      - backend-net
    ports:
      - "8081:8081"
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  post:
    build:
      context: ../backend
      dockerfile: post/Dockerfile
    image: nexusops0713/gamehouse:post-${BACKEND_VERSION:-develop}
    platform: linux/amd64
    pull_policy: always
    mem_limit: 700m
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=post_svc
      POST_DB_USERNAME: ${DB_USERNAME:-duo}
      POST_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_AMQP_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      USER_SERVICE_URL: http://user:8081
      POST_SERVICE_URL: http://post:8082
      CHAT_SERVICE_URL: http://chat:8083
      RIOT_SERVICE_URL: http://riot:8084
      MATCH_SERVICE_URL: http://match:8085
    networks:
      - frontend-net
      - backend-net
    ports:
      - "8082:8082"
      - "127.0.0.1:8182:8182"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  chat:
    build:
      context: ../backend
      dockerfile: chat/Dockerfile
    image: nexusops0713/gamehouse:chat-${BACKEND_VERSION:-develop}
    platform: linux/amd64
    pull_policy: always
    mem_limit: 700m
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=chat_svc
      CHAT_DB_USERNAME: ${DB_USERNAME:-duo}
      CHAT_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_AMQP_PORT: 5672
      RABBITMQ_STOMP_PORT: 61613
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      USER_SERVICE_URL: http://user:8081
      POST_SERVICE_URL: http://post:8082
      CHAT_SERVICE_URL: http://chat:8083
      RIOT_SERVICE_URL: http://riot:8084
      MATCH_SERVICE_URL: http://match:8085
    networks:
      - frontend-net
      - backend-net
    ports:
      - "8083:8083"
      - "127.0.0.1:8183:8183"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  riot:
    build:
      context: ../backend
      dockerfile: riot/Dockerfile
    image: nexusops0713/gamehouse:riot-${BACKEND_VERSION:-develop}
    platform: linux/amd64
    pull_policy: always
    mem_limit: 700m
    environment:
      SERVER_PORT: 8084
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RIOT_API_KEY: ${RIOT_API_KEY:-dummy_key}
      USER_SERVICE_URL: http://user:8081
      POST_SERVICE_URL: http://post:8082
      CHAT_SERVICE_URL: http://chat:8083
      RIOT_SERVICE_URL: http://riot:8084
      MATCH_SERVICE_URL: http://match:8085
    networks:
      - frontend-net
      - backend-net
    ports:
      - "8084:8084"
      - "127.0.0.1:8184:8184"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  match:
    build:
      context: ../backend
      dockerfile: match/Dockerfile
    image: nexusops0713/gamehouse:match-${BACKEND_VERSION:-develop}
    platform: linux/amd64
    pull_policy: always
    mem_limit: 700m
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=match_svc
      MATCH_DB_USERNAME: ${DB_USERNAME:-duo}
      MATCH_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LLM_API_KEY: ${LLM_API_KEY:-dummy_key}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_AMQP_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      USER_SERVICE_URL: http://user:8081
      POST_SERVICE_URL: http://post:8082
      CHAT_SERVICE_URL: http://chat:8083
      RIOT_SERVICE_URL: http://riot:8084
      MATCH_SERVICE_URL: http://match:8085
    networks:
      - frontend-net
      - backend-net
    ports:
      - "8085:8085"
      - "127.0.0.1:8185:8185"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  crew:
    build:
      context: ../backend
      dockerfile: crew/Dockerfile
    image: nexusops0713/gamehouse:crew-${BACKEND_VERSION:-develop}
    platform: linux/amd64
    pull_policy: always
    mem_limit: 700m
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=crew_svc
      CREW_DB_USERNAME: ${DB_USERNAME:-duo}
      CREW_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_AMQP_PORT: 5672
      RABBITMQ_STOMP_PORT: 61613
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      USER_SERVICE_URL: http://user:8081
      POST_SERVICE_URL: http://post:8082
      CHAT_SERVICE_URL: http://chat:8083
      RIOT_SERVICE_URL: http://riot:8084
      MATCH_SERVICE_URL: http://match:8085
      CREW_SERVICE_URL: http://crew:8086
    networks:
      - frontend-net
      - backend-net
    ports:
      - "8086:8086"
      - "127.0.0.1:8186:8186"
    healthcheck:
      # 런타임 이미지에 curl/wget이 없어 Bash 내장 TCP로 실제 HTTP 응답을 확인한다.
      # 200과 Actuator status=UP을 모두 확인해 포트만 열린 상태를 healthy로 보지 않는다.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8186 || exit 1;
          printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          response=$$(cat <&3);
          printf "%s" "$$response" | grep -qE "^HTTP/[0-9.]+ 200 " &&
          printf "%s" "$$response" | grep -qE '"status"[[:space:]]*:[[:space:]]*"UP"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    profiles: ["legacy"]
    image: nexusops0713/gamehouse:backend-${BACKEND_VERSION:-develop}
    # CI가 linux/amd64로만 빌드한다. Apple Silicon(arm64) 맥에서
    # 이 지정이 없으면 `no matching manifest for linux/arm64/v8` 로 실패한다.
    # 맥에서는 Rosetta 에뮬레이션으로 돌아 기동이 느린 것이 정상이다.
    platform: linux/amd64
    # up 할 때마다 registry를 확인한다.
    # develop 태그는 같은 이름에 계속 덮어써지므로(mutable),
    # 이게 없으면 로컬에 캐시된 옛 이미지를 그대로 재사용해 배포가 반영되지 않는다.
    # 로컬에서 소스로 빌드해 띄우려면 `docker compose up -d --build` 를 쓴다.
    pull_policy: always
    container_name: gamehouse-backend
    # t3.small(2GiB)에서 관찰 스택까지 얹으므로 컨테이너별 상한을 명시한다.
    # 한계가 없으면 OOM killer 가 "가장 큰 프로세스" = 이 JVM 을 골라 죽인다.
    mem_limit: 700m
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      # ---- 메모리 상한 ------------------------------------------------------
      # 측정값(로컬, 유휴 상태): RSS 565MB = 힙 87 + 비힙 158 + 미추적 네이티브 321
      # 미추적분이 가장 크고, 그중 상당량이 스레드 스택(121개)과 glibc 메모리 풀이다.
      #
      # glibc 는 스레드마다 메모리 풀(arena)을 만들어 RSS 를 부풀린다.
      # 컨테이너 자바에서 잘 알려진 현상으로, 2 로 제한하면 보통 50~100MB 줄어든다.
      MALLOC_ARENA_MAX: "2"
      #
      # Dockerfile 의 ENTRYPOINT 가 exec form(["java","-jar",...])이라 명령줄에
      # JVM 옵션을 끼워 넣을 수 없다. JAVA_TOOL_OPTIONS 는 JVM 이 기동 시 자동으로
      # 읽는 환경변수라, 이미지를 다시 만들지 않고 옵션을 주입할 수 있다.
      # 적용되면 기동 로그에 "Picked up JAVA_TOOL_OPTIONS: ..." 가 찍힌다.
      #
      #   -Xmx200m                  : 미지정 시 JVM 은 mem_limit 의 25%(=175m)를
      #                               힙 최대치로 잡는다. 현재 committed 가 87m 이므로
      #                               2배 여유를 두되 무제한 성장은 막는다.
      #   -Xss512k                  : 스레드당 스택 1MB → 512KB. 스레드가 121개라 체감이 크다.
      #   -XX:MaxDirectMemorySize   : 미지정 시 기본값이 -Xmx 와 같다. WebFlux(netty)가
      #                               Direct 버퍼를 쓰므로 별도로 천장을 씌운다.
      #
      # MaxMetaspaceSize 는 일부러 넣지 않았다. 비힙이 아직 JIT 워밍업으로 상승 중이라
      # 안정된 값을 확인한 뒤에 정하는 것이 맞다.
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:MaxDirectMemorySize=64m"
      # ----------------------------------------------------------------------
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME:-duo}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /app/uploads
      RIOT_API_KEY: ${RIOT_API_KEY:?RIOT_API_KEY is required}
      # RabbitMQ STOMP 릴레이 접속 정보. host 는 compose 네트워크상의 서비스명.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_STOMP_PORT: 61613
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - frontend-net
      - backend-net
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    healthcheck:
      # 런타임 이미지에 curl 없음 → bash 로 포트 TCP 체크
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build: ../frontend
    image: nexusops0713/gamehouse:frontend-${FRONTEND_VERSION:-develop}
    # backend와 동일. 상세 설명은 backend 쪽 주석 참고.
    platform: linux/amd64
    pull_policy: always
    container_name: gamehouse-frontend
    depends_on:
      user:
        condition: service_healthy
      post:
        condition: service_healthy
      chat:
        condition: service_healthy
      match:
        condition: service_healthy
      crew:
        condition: service_healthy
    # 런타임 주입 → entrypoint 가 dist/config.js와 nginx upstream 설정을 생성한다.
    # upstream은 Compose 서비스명으로 지정해 port 80에서 MSA별 reverse proxy를 제공한다.
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-}
      WS_URL: ${FRONTEND_WS_URL:-}
      BACKEND_ORIGIN: ${FRONTEND_BACKEND_ORIGIN:-}
      USER_UPSTREAM: user:8081
      POST_UPSTREAM: post:8082
      CHAT_UPSTREAM: chat:8083
      MATCH_UPSTREAM: match:8085
      CREW_UPSTREAM: crew:8086
      NGINX_RESOLVER: 127.0.0.11
    networks:
      - frontend-net
    ports:
      - "80:5173"
#     - "5173:5173" // Dev 환경에서도 80 포트만 사용하므로 5173은 외부에 공개하지 않는다.
    healthcheck:
      # nginx:alpine의 wget으로 SPA가 아닌 healthz 자체를 확인한다.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# frontend-net: frontend↔backend / backend-net: backend↔rabbitmq (내부 인프라 격리)
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  backend-uploads:
  rabbitmq-data:
