name: gamehouse

services:
  db:
    image: postgres:16-alpine
    container_name: duo-db
    environment:
      POSTGRES_DB: ${DB_NAME:-duo}
      POSTGRES_USER: ${DB_USERNAME:-duo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - duo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  duo-db-data:
