# ---------------------------------------------------------------------------
# dev(EKS) 워크로드 — 초안
#
# ⚠️ destination.server 가 비어 있다. EKS 클러스터가 생겨야 채울 수 있다.
#    그 전에는 이 파일을 apply 하지 않는다.
#
# 정책은 local 에서 검증한 것을 그대로 옮겼다(k8s/argocd/applications/local.yaml).
# 다른 점은 셋뿐이다 — path, targetRevision, 그리고 Secret 예외가 없다는 것.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gamehouse-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/NexusOps-gamehouse/infra.git
    # 브랜치가 곧 환경 경계다. base 를 고쳐 develop 에 넣으면 dev 만 반영되고
    # prod 는 알지 못한다. main 으로 머지해야 prod 에 도달한다.
    targetRevision: develop
    path: k8s/overlays/dev

  destination:
    # TODO: EKS API 엔드포인트. C1 에서 cluster 를 등록한 뒤 그 server URL 을 넣는다.
    server: REPLACE_AT_DEPLOY
    namespace: gamehouse

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    # HPA 가 관리하는 필드. local 에서 검증한 것과 동일하며 원인이 매니페스트 구조라
    # 클러스터와 무관하게 그대로 적용된다. overlays/dev 에도 replicas-*.yaml 6개와
    # hpa-*.yaml 5개가 함께 있다.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  # local 에 있던 Secret 예외는 여기 없다.
  # components/aws 가 평문 Secret 을 $patch: delete 로 지우고 ExternalSecret 이 대신
  # 들어가므로, Argo CD 가 소유하는 것은 ExternalSecret 이고 그것이 만든 Secret 은
  # 소유하지 않는다. 예외를 둘 대상 자체가 없다.
