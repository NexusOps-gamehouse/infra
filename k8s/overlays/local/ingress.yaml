# local — kind + ingress-nginx. 섹션10 "Ingress 경로" 표를 그대로 옮긴다.
# 사전 준비:
#   1) kind cluster 가 ingress-nginx 를 설치하고 있어야 한다(80/443 hostPort 매핑은
#      ../../../kind-config.yaml 참고).
#   2) /etc/hosts 에 `127.0.0.1 gamehouse.local` 추가.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamehouse
  namespace: gamehouse
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # /ws · /ws-house 장시간 연결 유지
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: gamehouse.local
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/users
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/friends
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/notifications
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          # 프로필 이미지 등 업로드 파일. user 가 파일을 소유하고 정적 리소스로 서빙한다
          # (user/config/WebConfig 의 addResourceHandler("/uploads/**"), 인증 불필요).
          # /api 로 시작하지 않아 눈에 잘 안 띄지만 빠뜨리면 이미지가 전부 깨진다.
          #
          # ⚠️ S3 로 옮기면 이 규칙은 지운다. local 은 replicas 1 이라 지금은 멀쩡해
          #    보이지만, 파일이 컨테이너 쓰기 레이어에 쌓이는 구조라 파드를 재시작하면
          #    사라진다. dev/prod 는 replicas 2~3 이라 더 심하게 깨진다 —
          #    components/aws/ingress.yaml 의 같은 블록에 자세히 적어 뒀다.
          - path: /uploads
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/posts
            pathType: Prefix
            backend:
              service: { name: post, port: { number: 8080 } }
          - path: /api/applications
            pathType: Prefix
            backend:
              service: { name: post, port: { number: 8080 } }
          # 이름과 달리 user 가 아니라 post 소유다 — PostController 의 /api/my/posts,
          # ApplicationController 의 /api/my/applications ("내가 쓴 글/지원 내역").
          - path: /api/my
            pathType: Prefix
            backend:
              service: { name: post, port: { number: 8080 } }
          - path: /api/chat
            pathType: Prefix
            backend:
              service: { name: chat, port: { number: 8080 } }
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: chat, port: { number: 8080 } }
          - path: /api/match
            pathType: Prefix
            backend:
              service: { name: match, port: { number: 8080 } }
          # crew — House(크루) 목록·상세·공지·일정·채팅.
          - path: /api/crew
            pathType: Prefix
            backend:
              service: { name: crew, port: { number: 8080 } }
          # House 채팅 WebSocket(SockJS/STOMP). chat 의 /ws 와 경로를 나눈 이유는
          # crew/config/WebSocketConfig.java 주석 참고 — 같은 /ws 면 갈라낼 수 없다.
          - path: /ws-house
            pathType: Prefix
            backend:
              service: { name: crew, port: { number: 8080 } }
          # 아래 둘은 프론트가 아직 목 저장소를 쓰고 있어(frontend/src/mocks/houseStorage.js)
          # 실제 호출은 없다. 그래도 미리 뚫어 둔다 — 백엔드에 이미 있는 경로라
          # 프론트가 붙는 순간 인프라 변경 없이 바로 동작해야 하기 때문이다.
          # ⚠️ frontend/vite.config.js 의 프록시에는 아직 없다. 프론트를 붙일 때
          #    거기도 같이 넣어야 개발(vite)과 운영(Ingress)이 갈리지 않는다.
          - path: /api/houses
            pathType: Prefix
            backend:
              service: { name: crew, port: { number: 8080 } }
          - path: /api/shop
            pathType: Prefix
            backend:
              service: { name: crew, port: { number: 8080 } }
          # riot 은 외부 노출 없음 — 의도적으로 경로가 없다.
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 5173 } }
