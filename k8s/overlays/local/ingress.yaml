# local — kind + ingress-nginx. 섹션10 "Ingress 경로" 표를 그대로 옮긴다.
# 사전 준비:
#   1) kind cluster 가 ingress-nginx 를 설치하고 있어야 한다(80/443 hostPort 매핑은
#      ../../../kind-config.yaml 참고).
#   2) /etc/hosts 에 `127.0.0.1 gamehouse.local` 추가.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamehouse
  namespace: gamehouse
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # /ws 장시간 연결 유지
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: gamehouse.local
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/users
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/friends
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/notifications
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/posts
            pathType: Prefix
            backend:
              service: { name: post, port: { number: 8080 } }
          - path: /api/applications
            pathType: Prefix
            backend:
              service: { name: post, port: { number: 8080 } }
          # 이름과 달리 user 가 아니라 post 소유다 — PostController 의 /api/my/posts,
          # ApplicationController 의 /api/my/applications ("내가 쓴 글/지원 내역").
          - path: /api/my
            pathType: Prefix
            backend:
              service: { name: post, port: { number: 8080 } }
          - path: /api/chat
            pathType: Prefix
            backend:
              service: { name: chat, port: { number: 8080 } }
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: chat, port: { number: 8080 } }
          - path: /api/match
            pathType: Prefix
            backend:
              service: { name: match, port: { number: 8080 } }
          # crew — base/kustomization.yaml 에서 제외됨. 되살릴 때 같이 푼다.
          # ingress-nginx 는 없는 백엔드를 해당 경로만 503 으로 흘려보내 여기서는 티가
          # 안 나지만, 같은 참조가 dev/prod 에서는 ALB reconcile 을 멈춰 세운다
          # (components/aws/ingress.yaml 의 같은 블록 참고). 두 파일을 항상 같이 푼다.
          #
          # ⚠️ 여기에 경로가 없으면 아래 `/` 규칙이 대신 잡아 frontend nginx 로 간다.
          #    브라우저로 GET 하면 index.html 이 200 OK 로 돌아와 "붙는 것처럼" 보이지만,
          #    프론트의 POST 는 정적 파일에 대한 POST 라 405 가 되고 본문이 HTML 이라
          #    에러 메시지도 안 잡힌다. 404 가 아니라서 원인이 잘 안 보인다.
          # - path: /api/crews
          #   pathType: Prefix
          #   backend:
          #     service: { name: crew, port: { number: 8080 } }
          # riot 은 외부 노출 없음 — 의도적으로 경로가 없다.
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 5173 } }
