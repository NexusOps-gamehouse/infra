# 로컬은 기본적으로 LLM 을 호출하지 않는다 — dummy_key 면 규칙 기반 문구로 대체된다.
# 실제 키로 테스트하려면 infra/.env.k8s.local 에 LLM_API_KEY 를 넣고
# scripts/k8s-local-secrets.sh 를 실행한다(k8s-local-up.sh 가 자동으로 호출한다).
apiVersion: v1
kind: Secret
metadata:
  name: match-llm-secret
  namespace: gamehouse
  annotations:
    # Argo CD 가 이 Secret 만 server-side apply 로 처리하게 한다.
    # client-side apply 는 매니페스트 전체를 last-applied-configuration 애노테이션에
    # 남기는데, ignoreDifferences 로 live 값(진짜 키)이 채워져 apply 되므로 그 키가
    # 애노테이션에 평문으로 박힌다. server-side apply 는 그 애노테이션을 쓰지 않는다.
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: Opaque
stringData:
  LLM_API_KEY: "dummy_key"
