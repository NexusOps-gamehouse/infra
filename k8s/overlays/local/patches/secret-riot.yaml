# 실제 Riot API 키를 넣어야 라이엇 연동이 동작한다.
# `kubectl -n gamehouse create secret generic riot-secret \
#    --from-literal=RIOT_API_KEY=<실제키> --dry-run=client -o yaml | kubectl apply -f -`
# 로 로컬에서 직접 덮어쓰는 걸 권장 — 이 파일엔 더미값만 둔다.
apiVersion: v1
kind: Secret
metadata:
  name: riot-secret
  namespace: gamehouse
  annotations:
    # Argo CD 가 이 Secret 만 server-side apply 로 처리하게 한다.
    # client-side apply 는 매니페스트 전체를 last-applied-configuration 애노테이션에
    # 남기는데, ignoreDifferences 로 live 값(진짜 키)이 채워져 apply 되므로 그 키가
    # 애노테이션에 평문으로 박힌다. server-side apply 는 그 애노테이션을 쓰지 않는다.
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: Opaque
stringData:
  RIOT_API_KEY: "dummy_key"
