# ⚠️ 이 값은 kind 로컬 클러스터 전용 더미다. 팀의 application-secret.yml 값과
# 일부러 다르게 둔다 — 이 저장소는 공개(public)이고, backend 는 같은 이유로
# application-secret.yml 을 .gitignore 에 넣어 뒀다(backend/.gitignore:9).
# 여기 값이 새어 나가도 이 클러스터 밖에서는 아무것도 열지 못한다.
# 운영 값은 여기 없다 — overlays/prod/external-secrets.yaml 참고.
apiVersion: v1
kind: Secret
metadata:
  name: user-db-credentials
  namespace: gamehouse
type: Opaque
stringData:
  DB_HOST: "postgres.gamehouse.svc.cluster.local"
  DB_USERNAME: "duo_user"
  DB_PASSWORD: "kind-dev-only-user"
