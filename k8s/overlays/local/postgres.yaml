# local 전용 — kind 클러스터 안에서 도는 단일 PostgreSQL.
# prod 는 RDS 를 쓰므로 이 파일은 overlays/local 에만 존재한다(overlays/prod 에는 없음).
#
# docker-compose.local.yml 의 postgres 서비스(postgres:16, DB duo)를 그대로 옮긴 것.
# 다만 섹션11 설계대로 "한 DB, 서비스별 스키마" 구조에 맞춰 initdb 스크립트가
# user_/post_/chat_/match_/crew_ 스키마를 미리 만들어 둔다 — 안 그러면 각 서비스가
# 뜨자마자 ddl-auto: update 가 스키마 없음으로 실패한다.
#
# ⚠️ /docker-entrypoint-initdb.d 는 PGDATA 가 비어 있을 때만 실행된다. PVC 가 이미
#    초기화된 클러스터에서는 이 파일을 고쳐도 반영되지 않는다 — 서비스를 새로
#    추가했는데 인증 실패가 나면 그것이다. 둘 중 하나로 푼다:
#      1) PVC 를 지우고 다시 뜨게 한다 (로컬 데이터도 같이 날아간다)
#         kubectl -n gamehouse delete deployment postgres
#         kubectl -n gamehouse delete pvc postgres-data
#         kubectl apply -k k8s/overlays/local
#      2) 이미 도는 DB 에 계정만 직접 넣는다 (데이터 보존)
#         kubectl -n gamehouse exec deploy/postgres -- psql -U duo -d duo -c \
#           "CREATE USER duo_crew WITH PASSWORD 'kind-dev-only-crew';
#            CREATE SCHEMA crew_svc AUTHORIZATION duo_crew;
#            ALTER ROLE duo_crew SET search_path TO crew_svc;"
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: gamehouse
data:
  # backend/db/migration/local-bootstrap.sql 과 같은 구조다. 비밀번호는 일부러
  # 팀의 application-secret.yml 값과 다르게 뒀다 — 이 저장소는 공개이고,
  # 그 값들은 로컬 compose DB 도 함께 지키고 있어 재사용 위험이 있다.
  # 이 값은 kind 클러스터 밖에서 아무것도 열지 못한다. 값이 갈라지면
  # 로컬 compose 개발자와 kind 개발자가 서로 다른 DB 를 보게 되므로 같이 고칠 것.
  #
  # 스키마 이름의 _svc 접미사: user 는 PostgreSQL 예약어다(SELECT user 는 현재
  # 접속 계정을 돌려준다). 셋 다 같은 규칙으로 맞춘다.
  01-bootstrap.sql: |
    \set ON_ERROR_STOP on
    BEGIN;

    -- 서비스별 접속 계정. users 테이블의 회원 계정과는 무관하다.
    -- 앱이 PostgreSQL 에 로그인할 때 쓰는 것이다.
    CREATE USER duo_user WITH PASSWORD 'kind-dev-only-user';
    CREATE USER duo_post WITH PASSWORD 'kind-dev-only-post';
    CREATE USER duo_chat WITH PASSWORD 'kind-dev-only-chat';
    CREATE USER duo_match WITH PASSWORD 'kind-dev-only-match';
    CREATE USER duo_crew WITH PASSWORD 'kind-dev-only-crew';

    -- AUTHORIZATION 이 핵심이다. 소유자가 되어야 ddl-auto: update 가 그 안에서
    -- 테이블을 만들 수 있다. GRANT 로 읽기·쓰기만 주면 부팅할 때 막힌다.
    CREATE SCHEMA user_svc AUTHORIZATION duo_user;
    CREATE SCHEMA post_svc AUTHORIZATION duo_post;
    CREATE SCHEMA chat_svc AUTHORIZATION duo_chat;
    CREATE SCHEMA match_svc AUTHORIZATION duo_match;
    CREATE SCHEMA crew_svc AUTHORIZATION duo_crew;

    -- 접속하면 자기 스키마를 먼저 보게 한다. Hibernate 의 default_schema 는
    -- Hibernate 가 만든 쿼리에만 적용되므로 네이티브 쿼리까지 덮으려면 이쪽도 건다.
    ALTER ROLE duo_user SET search_path TO user_svc;
    ALTER ROLE duo_post SET search_path TO post_svc;
    ALTER ROLE duo_chat SET search_path TO chat_svc;
    ALTER ROLE duo_match SET search_path TO match_svc;
    ALTER ROLE duo_crew SET search_path TO crew_svc;

    -- riot 은 소유 테이블이 0개라 DB 를 아예 쓰지 않는다(V1__split_schemas.sql 참고).

    -- 새 테이블이 실수로 public 에 만들어지면 경계 밖에 놓인다. 아무도 못 만들게 막는다.
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;

    COMMIT;
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: gamehouse
type: Opaque
# local 전용 더미값 — kind 로컬 클러스터 밖으로 나가지 않으므로 커밋해도 안전하다.
# prod 에서는 이 Secret 자체가 존재하지 않는다(RDS 는 components/aws/external-secrets/ 로 관리).
stringData:
  POSTGRES_DB: "duo"
  POSTGRES_USER: "duo"
  POSTGRES_PASSWORD: "kind-dev-only-duo"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: gamehouse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: Recreate  # ReadWriteOnce PVC — 롤링 시 두 파드가 동시에 마운트하면 안 됨
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: postgres
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "duo", "-d", "duo"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "duo", "-d", "duo"]
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: initdb
          configMap:
            name: postgres-initdb
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: gamehouse
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/managed-by: kustomize
  ports:
    - name: postgres
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: gamehouse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/managed-by: kustomize
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: user
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: post
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chat
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: match
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: crew
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-exporter
      ports:
        - protocol: TCP
          port: 5432
