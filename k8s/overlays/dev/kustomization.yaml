# dev — kind 클러스터. ingress-nginx + in-cluster postgres + frontend Pod.
# 사용법: kubectl apply -k k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - postgres.yaml
  - frontend.yaml
  - ingress.yaml

patches:
  - path: patches/configmap-user.yaml
  - path: patches/configmap-post.yaml
  - path: patches/configmap-chat.yaml
  # match / crew — base/kustomization.yaml 에서 제외됨. 되살릴 때 같이 푼다.
  # - path: patches/configmap-match.yaml
  # - path: patches/configmap-crew.yaml
  - path: patches/configmap-riot.yaml
  - path: patches/secret-db-user.yaml
  - path: patches/secret-db-post.yaml
  - path: patches/secret-db-chat.yaml
  # - path: patches/secret-db-match.yaml
  # - path: patches/secret-db-crew.yaml
  - path: patches/secret-jwt.yaml
  - path: patches/secret-rabbitmq.yaml
  - path: patches/secret-riot.yaml
  - path: patches/replicas-user.yaml
  - path: patches/replicas-post.yaml
  - path: patches/replicas-chat.yaml
  # - path: patches/replicas-match.yaml
  # - path: patches/replicas-crew.yaml
  - path: patches/replicas-riot.yaml
  - path: patches/hpa-chat.yaml
  # - path: patches/hpa-match.yaml

# 이미지 태그는 base 기본값(<service>-... 아니라 <service 별 레포>:develop)을 그대로 쓴다.
# dev 에서 특정 브랜치/커밋 이미지를 테스트하려면 여기 images: 를 추가하는 대신
# `kustomize edit set image nexusops0713/gamehouse-user=nexusops0713/gamehouse-user:<tag>` 처럼
# 서비스별로 개별 지정한다 — 레포가 서비스마다 분리돼 있어 안전하다.

images:
  # dev 는 로컬에서 빌드해 kind 노드에 직접 적재한 이미지를 쓴다. 레지스트리를 안 탄다.
  #
  #   cd backend
  #   docker build -t gamehouse-user:develop -f user/Dockerfile .   # 컨텍스트는 backend/ 루트
  #   kind load docker-image gamehouse-user:develop --name gamehouse-dev
  #
  # CI 이미지(nexusops0713/gamehouse:<svc>-develop)를 쓰지 않는 이유가 둘 있다.
  #   1. 비공개 레포라 imagePullSecrets 가 필요하다 — 아직 없다.
  #   2. CI 가 platforms: linux/amd64 단일 빌드라 arm64 kind 노드에서는
  #      no matching manifest for linux/arm64 로 실패한다.
  # 둘 다 풀리면 각 항목에 newName: nexusops0713/gamehouse 를 추가하고
  # newTag 를 <svc>-develop 으로 바꾸면 레지스트리 경로로 전환된다.
  - name: gamehouse-user
    newTag: develop
  - name: gamehouse-post
    newTag: develop
  - name: gamehouse-chat
    newTag: develop
  - name: gamehouse-riot
    newTag: develop
  - name: gamehouse-frontend
    newTag: develop
  - name: gamehouse-rabbitmq
    newTag: develop

labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: true
