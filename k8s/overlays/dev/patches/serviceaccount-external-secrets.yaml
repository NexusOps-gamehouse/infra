# ⚠️ CHANGE_ME: 실제 AWS 계정 ID.
#
# 이 값을 채우면 AWS 계정 ID 가 이 저장소에 평문으로 남는다. 가릴 방법이 마땅치 않다 —
# IRSA 는 ServiceAccount 의 annotation 이어야 해서 ExternalSecret 으로 못 채운다.
# 그래서 계정 ID 는 공개되는 값으로 취급한다. 실제 방어선은 이 값의 은닉이 아니라
# IAM 쪽이다:
#   - 역할의 신뢰 정책이 이 클러스터의 OIDC provider + 이 ServiceAccount 로 좁혀져 있을 것
#     (Principal 이나 sub 조건이 와일드카드면 계정 ID 만으로 넘볼 여지가 생긴다)
#   - 권한 정책은 gamehouse/dev/* 만 읽도록 좁힐 것
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: gamehouse
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::CHANGE_ME_ACCOUNT_ID:role/gamehouse-dev-external-secrets-role
