# 실제 Riot API 키를 넣어야 라이엇 연동이 동작한다.
# `kubectl -n gamehouse create secret generic riot-secret \
#    --from-literal=RIOT_API_KEY=<실제키> --dry-run=client -o yaml | kubectl apply -f -`
# 로 로컬에서 직접 덮어쓰는 걸 권장 — 이 파일엔 더미값만 둔다.
apiVersion: v1
kind: Secret
metadata:
  name: riot-secret
  namespace: gamehouse
type: Opaque
stringData:
  RIOT_API_KEY: "dummy_key"
