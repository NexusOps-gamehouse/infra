# ⚠️ CHANGE_ME 2곳 — dev 용 ACM 인증서 ARN, dev 도메인.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamehouse
  namespace: gamehouse
  annotations:
    # prod 와 반드시 달라야 한다 — 같은 AWS 계정에서 group.name 이 겹치면
    # dev/prod 두 클러스터의 LB 컨트롤러가 ALB 하나를 서로 덮어쓴다.
    alb.ingress.kubernetes.io/group.name: gamehouse-dev
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:CHANGE_ME_ACCOUNT_ID:certificate/CHANGE_ME
