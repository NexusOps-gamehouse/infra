# Grafana 관리자 계정. kube-prometheus-stack values 의 admin.existingSecret 이 이 이름을 본다.
#
# ⚠️ secretKey 는 Grafana 차트가 찾는 이름이고(admin-user / admin-password),
#    property 는 Secrets Manager JSON 의 키다. 둘이 다른 것이 정상이다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gamehouse-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: gamehouse/main/observability/grafana-admin
        property: GF_ADMIN_USER
    - secretKey: admin-password
      remoteRef:
        key: gamehouse/main/observability/grafana-admin
        property: GF_ADMIN_PASSWORD
