# postgres-exporter 의 RDS 접속 정보. gamehouse 네임스페이스다 — Deployment 가 거기 있다.
#
# DB_HOST 도 여기서 받는다. 자격증명은 아니지만 '접속 가능한 대상 주소'라 저장소에 두지
# 않는다. components/aws 의 ExternalSecret 들과 같은 판단이다.
#
# ⚠️ Secrets Manager 쪽 키(property)는 옛 관측 스택 .env 의 이름을 그대로 쓴다.
#    k8s Secret 쪽 키(secretKey)는 컴포넌트의 secretKeyRef 가 찾는 이름이다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-exporter-db
  namespace: gamehouse
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gamehouse-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-exporter-db
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: gamehouse/main/observability/postgres-exporter
        property: DB_HOST
    - secretKey: POSTGRES_DB
      remoteRef:
        key: gamehouse/main/observability/postgres-exporter
        property: DB_NAME
    - secretKey: POSTGRES_USER
      remoteRef:
        key: gamehouse/main/observability/postgres-exporter
        property: PG_EXPORTER_USERNAME
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: gamehouse/main/observability/postgres-exporter
        property: PG_EXPORTER_PASSWORD
