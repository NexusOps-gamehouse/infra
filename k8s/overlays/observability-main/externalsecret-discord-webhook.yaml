# Alertmanager 발송지. AlertmanagerConfig 의 apiURL secretRef 가 이 이름을 본다.
#
# ⚠️ URL 자체가 비밀번호다. 어떤 파일에도 값을 적지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-webhook
  namespace: observability
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gamehouse-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: gamehouse/main/observability/discord-webhook
        property: DISCORD_WEBHOOK_URL
