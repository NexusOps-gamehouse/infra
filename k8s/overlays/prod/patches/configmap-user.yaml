# DB_HOST 는 여기 없다 — ExternalSecret 이 AWS Secrets Manager 에서 받아온다.
# (external-secrets/external-secret-db-user.yaml)
#
# 프로필 이미지는 브라우저가 Presigned PUT URL을 통해 S3에 직접 업로드한다.
# User 서비스는 EKS Pod Identity로 AWS 자격 증명을 받아 Presigned URL을 생성한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-config
  namespace: gamehouse
data:
  ENV_NAME: "prod"
  CORS_ALLOWED_ORIGINS: "https://game-duo.com"
  AWS_REGION: "ap-northeast-2"
  PROFILE_IMAGE_BUCKET: "gamehouse-profile-images-main-629049518933"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
