# ⚠️ CHANGE_ME: prod 용 ACM 인증서 ARN.
# ARN 에 AWS 계정 ID 와 리전이 포함된다 — 저장소에 그대로 남는다.
# serviceaccount-external-secrets.yaml 의 같은 주석 참고(계정 ID 는 공개 값으로 취급한다).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamehouse
  namespace: gamehouse
  annotations:
    # dev 와 반드시 달라야 한다 — 같은 AWS 계정에서 group.name 이 겹치면
    # dev/prod 두 클러스터의 LB 컨트롤러가 ALB 하나를 서로 덮어쓴다.
    alb.ingress.kubernetes.io/group.name: gamehouse-prod
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:CHANGE_ME_ACCOUNT_ID:certificate/CHANGE_ME
