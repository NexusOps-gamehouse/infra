# prod — Main EKS + ALB + RDS. frontend는 S3 + CloudFront로 별도 운영한다.
#
# AWS 공통 Kubernetes 구성은 components/aws에서 관리하고,
# 이 overlay에서는 Main 환경의 설정값, replicas/HPA, NetworkPolicy,
# ExternalSecret 경로 및 ECR 이미지 등을 정의한다.
#
# 배포 전 주요 준비사항:
#   1) EKS 클러스터 및 필수 Add-on/Controller 구성
#      - metrics-server
#      - External Secrets Operator
#      - AWS Load Balancer Controller
#   2) Main RDS 및 서비스별 DB Role/Schema 구성
#   3) AWS Secrets Manager의 gamehouse/main/* Secret 구성
#      - DB(user/post/chat/match/crew)
#      - JWT / RabbitMQ / Riot / LLM
#   4) External Secrets Operator는 EKS Pod Identity를 통해
#      AWS Secrets Manager에 접근한다.
#   5) 애플리케이션 이미지는 서비스별 Amazon ECR repository를 사용한다.
#      최초 배포 이미지는 origin/main과 일치하는 commit SHA 태그로 고정한다.
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - env-configmap.yaml

components:
  - ../../components/aws

patches:
  - path: patches/ingress.yaml
  - path: patches/configmap-user.yaml
  - path: patches/configmap-post.yaml
  - path: patches/configmap-chat.yaml
  - path: patches/configmap-match.yaml
  - path: patches/configmap-crew.yaml
  - path: patches/configmap-riot.yaml
  # base 의 5432 egress 는 in-cluster postgres 를 본다 — dev/prod 는 RDS(클러스터 밖)라
  # 매칭되지 않는다. 관리 포트 ingress 도 클러스터 안 파드만 허용해 ALB 헬스체크가 막힌다.
  # 두 구멍을 서비스별로 ipBlock 규칙을 덧붙여 메운다.
  - path: patches/networkpolicy-user.yaml
    target:
      kind: NetworkPolicy
      name: user
  - path: patches/networkpolicy-post.yaml
    target:
      kind: NetworkPolicy
      name: post
  - path: patches/networkpolicy-chat.yaml
    target:
      kind: NetworkPolicy
      name: chat
  - path: patches/networkpolicy-match.yaml
    target:
      kind: NetworkPolicy
      name: match
  - path: patches/networkpolicy-crew.yaml
    target:
      kind: NetworkPolicy
      name: crew
  - path: patches/replicas-user.yaml
  - path: patches/replicas-post.yaml
  - path: patches/replicas-chat.yaml
  - path: patches/replicas-match.yaml
  - path: patches/replicas-crew.yaml
  - path: patches/replicas-riot.yaml
  - path: patches/hpa-user.yaml
  - path: patches/hpa-post.yaml
  - path: patches/hpa-chat.yaml
  - path: patches/hpa-match.yaml
  - path: patches/hpa-crew.yaml
  # placeholder Secret 삭제 패치는 components/aws 로 옮겼다(dev 와 공통).

# components/aws 의 ExternalSecret 경로 `gamehouse/ENV/...` 에서 ENV 세그먼트만
# env-configmap.yaml 의 값으로 바꾼다. dev 오버레이와 동일한 블록이다.
replacements:
  - source:
      kind: ConfigMap
      name: gamehouse-env
      fieldPath: data.ENV
    targets:
      - select:
          kind: ExternalSecret
        fieldPaths:
          - spec.data.*.remoteRef.key
        options:
          delimiter: /
          index: 1

images:
  # Main EKS는 서비스별 Amazon ECR repository를 사용한다.
  # 애플리케이션 이미지는 origin/main과 일치하는 commit SHA 태그로 고정한다.
  - name: gamehouse-user
    newName: 359554936090.dkr.ecr.ap-northeast-2.amazonaws.com/gamehouse-user
    newTag: main-a924e42c539cdde71f8d952ec79c7913213ef50d
  - name: gamehouse-post
    newName: 359554936090.dkr.ecr.ap-northeast-2.amazonaws.com/gamehouse-post
    newTag: main-799b7ae8951376569e1303c41f0565f8590dcf44
  - name: gamehouse-chat
    newName: 359554936090.dkr.ecr.ap-northeast-2.amazonaws.com/gamehouse-chat
    newTag: main-c13d5f9242c54e2a65e28a100b4379dfe773a643
  - name: gamehouse-match
    newName: 359554936090.dkr.ecr.ap-northeast-2.amazonaws.com/gamehouse-match
    newTag: main-caa7c743192e31c4080b0c7e17fc9762ab79a32b
  - name: gamehouse-crew
    newName: 359554936090.dkr.ecr.ap-northeast-2.amazonaws.com/gamehouse-crew
    newTag: main-7aa7512deb052d2f8d4913a1cb173d37f30e8f01
  - name: gamehouse-riot
    newName: 359554936090.dkr.ecr.ap-northeast-2.amazonaws.com/gamehouse-riot
    newTag: main-010e5ece8e0819dd2306db5417265e0382c21319

  # RabbitMQ는 별도로 관리하는 고정 revision 이미지를 사용한다.
  - name: gamehouse-rabbitmq
    newName: 359554936090.dkr.ecr.ap-northeast-2.amazonaws.com/gamehouse-rabbitmq
    newTag: "3-1"

labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: true
