# prod — EKS + ALB + RDS. frontend 없음(S3+CloudFront).
#
# 배포 전 필수 준비물 (이 kustomize 트리 밖):
#   1) EKS 클러스터 + AWS Load Balancer Controller + External Secrets Operator 설치
#   2) RDS(PostgreSQL) 인스턴스 생성 + user_/post_/chat_/match_/crew_ 스키마와
#      서비스별 DB 계정 생성 (섹션11 — "자기 스키마만 읽고 쓴다")
#   3) AWS Secrets Manager 에 gamehouse/prod/jwt, gamehouse/prod/rabbitmq,
#      gamehouse/prod/riot, gamehouse/prod/db/<service> 시크릿 등록
#   4) IAM 역할 4종(gamehouse-user-role, gamehouse-post-role, gamehouse-external-secrets-role,
#      AWS Load Balancer Controller 역할) 생성 후 이 디렉터리의 CHANGE_ME 를 실제 값으로 교체
#   5) 이미지 태그 고정 — 아래 images: 의 REPLACE_AT_DEPLOY 를 CI 가 실제 커밋 SHA로
#      바꾼다(고의로 존재하지 않는 태그를 기본값으로 둬서, 안 바꾸고 배포하면
#      ImagePullBackOff 로 "눈에 띄게" 실패하게 만들었다 — 조용히 develop 이미지가
#      prod 에 깔리는 사고를 막기 위함).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml
  - pdb.yaml
  - external-secrets/serviceaccount.yaml
  - external-secrets/cluster-secret-store.yaml
  - external-secrets/external-secret-jwt.yaml
  - external-secrets/external-secret-rabbitmq.yaml
  - external-secrets/external-secret-riot.yaml
  - external-secrets/external-secret-db-user.yaml
  - external-secrets/external-secret-db-post.yaml
  - external-secrets/external-secret-db-chat.yaml
  # match / crew — base/kustomization.yaml 에서 제외됨. 되살릴 때 같이 푼다.
  # - external-secrets/external-secret-db-match.yaml
  # - external-secrets/external-secret-db-crew.yaml

patches:
  - path: patches/configmap-user.yaml
  - path: patches/configmap-post.yaml
  - path: patches/configmap-chat.yaml
  # - path: patches/configmap-match.yaml
  # - path: patches/configmap-crew.yaml
  - path: patches/configmap-riot.yaml
  - path: patches/serviceaccount-user.yaml
  - path: patches/serviceaccount-post.yaml
  - path: patches/replicas-user.yaml
  - path: patches/replicas-post.yaml
  - path: patches/replicas-chat.yaml
  # - path: patches/replicas-match.yaml
  # - path: patches/replicas-crew.yaml
  - path: patches/replicas-riot.yaml
  - path: patches/hpa-chat.yaml
  # - path: patches/hpa-match.yaml
  # base 의 placeholder Secret 삭제 — ExternalSecret 이 같은 이름으로 다시 만든다.
  - path: patches/delete-secret-jwt.yaml
  - path: patches/delete-secret-rabbitmq.yaml
  - path: patches/delete-secret-riot.yaml
  - path: patches/delete-secret-user-db.yaml
  - path: patches/delete-secret-post-db.yaml
  - path: patches/delete-secret-chat-db.yaml
  # - path: patches/delete-secret-match-db.yaml
  # - path: patches/delete-secret-crew-db.yaml

images:
  # CI(backend·frontend 의 ci-cd.yml)는 레포 하나에 서비스를 태그 접두사로 구분해
  # 푸시한다 — nexusops0713/gamehouse:<service>-<sha>
  #
  # base 가 실제 레포 대신 서비스별 논리 이름(gamehouse-user 등)을 쓰는 이유가
  # 이것이다. images: 트랜스포머는 레포 이름으로만 매칭하므로, base 가
  # nexusops0713/gamehouse 를 직접 쓰면 4개 서비스가 전부 같은 이름이 되어
  # 서비스 하나만 골라 태그를 바꿀 수 없다.
  #
  # CI 는 서비스별로 이렇게 지정한다:
  #   kustomize edit set image gamehouse-user=nexusops0713/gamehouse:user-$GIT_SHA
  - name: gamehouse-user
    newName: nexusops0713/gamehouse
    newTag: user-REPLACE_AT_DEPLOY
  - name: gamehouse-post
    newName: nexusops0713/gamehouse
    newTag: post-REPLACE_AT_DEPLOY
  - name: gamehouse-chat
    newName: nexusops0713/gamehouse
    newTag: chat-REPLACE_AT_DEPLOY
  # - name: gamehouse-match
  #   newName: nexusops0713/gamehouse
  #   newTag: match-REPLACE_AT_DEPLOY
  # - name: gamehouse-crew
  #   newName: nexusops0713/gamehouse
  #   newTag: crew-REPLACE_AT_DEPLOY
  - name: gamehouse-riot
    newName: nexusops0713/gamehouse
    newTag: riot-REPLACE_AT_DEPLOY
  # ⚠️ rabbitmq 는 이미지를 푸시하는 CI 가 아직 없다. infra 의 ci-cd.yml 은
  #    docker-compose 검증만 하고, compose 는 rabbitmq 를 build: 로 로컬 빌드한다.
  #    EKS 에 올리려면 infra CI 에 build-push 잡을 추가해야 한다.
  - name: gamehouse-rabbitmq
    newName: nexusops0713/gamehouse
    newTag: rabbitmq-REPLACE_AT_DEPLOY

labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: true
