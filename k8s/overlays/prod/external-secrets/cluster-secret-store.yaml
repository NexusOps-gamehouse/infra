# External Secrets Operator(https://external-secrets.io) 가 클러스터에 미리 설치돼 있어야
# 한다 — Helm 차트로 설치하며 이 kustomize 트리 범위 밖이다(README 참고).
#
# 왜 Secret 을 git 에 안 두고 이렇게 하나 — RDS 비밀번호·JWT_SECRET·Riot API 키를
# base/*/db-secret.yaml 같은 placeholder 로 두면 누군가 실수로 CHANGE_ME 를 실제 값으로
# 채운 채 커밋하는 사고가 난다. AWS Secrets Manager 에 실제 값을 두고, 클러스터는
# IRSA 로 "읽기만" 하게 만들면 git 저장소에는 애초에 비밀이 존재하지 않는다.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gamehouse-aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: gamehouse
