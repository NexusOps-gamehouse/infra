# AWS Secrets Manager 의 gamehouse/prod/db/post 시크릿(JSON) 을 15분마다 동기화해
# k8s Secret `post-db-credentials` 을(를) 채운다. 키 이름은 Deployment 의 secretKeyRef 와 맞춰야 한다.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: post-db-credentials
  namespace: gamehouse
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gamehouse-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: post-db-credentials
    creationPolicy: Owner
  data:
      - secretKey: DB_USERNAME
        remoteRef:
          key: gamehouse/prod/db/post
          property: DB_USERNAME
      - secretKey: DB_PASSWORD
        remoteRef:
          key: gamehouse/prod/db/post
          property: DB_PASSWORD
