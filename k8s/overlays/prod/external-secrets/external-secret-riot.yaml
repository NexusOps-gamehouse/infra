# AWS Secrets Manager 의 gamehouse/prod/riot 시크릿(JSON) 을 15분마다 동기화해
# k8s Secret `riot-secret` 을(를) 채운다. 키 이름은 Deployment 의 secretKeyRef 와 맞춰야 한다.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: riot-secret
  namespace: gamehouse
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gamehouse-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: riot-secret
    creationPolicy: Owner
  data:
      - secretKey: RIOT_API_KEY
        remoteRef:
          key: gamehouse/prod/riot
          property: RIOT_API_KEY
