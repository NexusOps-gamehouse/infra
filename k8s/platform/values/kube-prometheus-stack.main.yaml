# kube-prometheus-stack — main(EKS) 용
# 로컬의 local + lowmem 두 파일을 하나로 합쳤다.
# 노드는 t3.large × 2 (allocatable 약 7.1GiB/노드). 앱 Request 4,736Mi 가 이미 올라간다.
fullnameOverride: kps

prometheus:
  prometheusSpec:
    # ⚠️ serviceMonitorSelector 를 직접 명시하지 말 것.
    #    차트가 release: kps 라벨로 거는 자동 selector 가 사라져서
    #    kubelet · coredns · apiserver · grafana 등 인프라 타겟이 통째로 빠진다.
    #    우리 리소스에도 그 라벨을 붙여뒀으므로 네임스페이스로만 좁힌다.
    serviceMonitorNamespaceSelector:
      matchNames: [gamehouse, observability]
    podMonitorNamespaceSelector:
      matchNames: [gamehouse, observability]
    ruleNamespaceSelector:
      matchNames: [gamehouse, observability]

    scrapeInterval: 30s        # 대시보드의 rate() 창 계산이 로컬과 같아야 한다
    enableRemoteWriteReceiver: false   # k6 수신구를 운영에 열어둘 이유가 없다

    retention: 15d             # 출발점. main 유입량을 재서 조정한다
    retentionSize: 15GB

    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { memory: 2Gi }

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          # 기본 SC 에 기대지 않는다. gp2 로 잡히면 바꿀 때 PVC 를 다시 만들어야 하고
          # 그때 쌓인 시계열이 날아간다.
          storageClassName: gp3
          resources:
            requests:
              storage: 20Gi

grafana:
  # Secret grafana-admin 은 설치 시 kubectl 로 만들고,
  # Secrets Manager 확정 후 ExternalSecret 이 같은 이름으로 만든다.
  # 만드는 주체만 바뀌므로 이 파일은 그때 손대지 않는다.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # ⚠️ UI 에서 비밀번호를 바꾸지 말 것. Secret 과 어긋나면 sidecar 가 401 을 받아
  #    대시보드 즉시 반영이 조용히 끊긴다.
  #
  # 노출 방식 미결정. 정해질 때까지 ClusterIP + port-forward.
  # ⚠️ 앱 ALB 에 합류시키면 internet-facing 을 그대로 탄다. 그냥 열지 말 것.
  service:
    type: ClusterIP
  ingress:
    enabled: false

  # ⚠️ 상한만 올리는 것은 처방이 아니다 — 384 → 640 으로 올린 뒤에도 OOMKilled 가 났다.
  #    Go 런타임이 유휴 힙을 붙들고 있는 것이 원인이라 GOMEMLIMIT 으로 반환을 강제한다.
  env:
    GOMEMLIMIT: "600MiB"
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { cpu: 500m, memory: 768Mi }

  # 대시보드가 코드화돼 있어 PV 가 필요 없다.
  # ⚠️ UI 에서 만든 대시보드는 다음 배포에 사라진다.
  persistence:
    enabled: false

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
    datasources:
      enabled: true
      searchNamespace: ALL

  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      jsonData:
        maxLines: 1000

# EKS 는 컨트롤 플레인이 관리형이라 이 셋은 긁을 수 없다.
kubeEtcd:              { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler:         { enabled: false }
# kubeProxy 는 EKS 에서 긁을 수 있을지 모른다. 배포 후 한 번 켜보고 UP 이면 그대로 둔다.
kubeProxy:             { enabled: false }
nodeExporter:          { enabled: true }
kube-state-metrics:    { enabled: true }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

# Alertmanager — 라우팅과 수신자는 AlertmanagerConfig CR 에 있다.
#   k8s/components/observability/alertmanagerconfig-gamehouse.yaml
# ⚠️ values 에 config: 를 같이 두면 안 된다. 둘 중 하나만 쓴다.
# ⚠️ 지금은 origin: gamehouse 라벨이 붙은 것만 Discord 로 나간다.
#    main 에서는 기본 규칙 중 31개를 살려야 한다. 목록은 별도 문서.
alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfiguration:
      name: gamehouse
      global:
        resolveTimeout: 5m
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits:   { memory: 192Mi }
