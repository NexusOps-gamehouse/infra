# Grafana Alloy — main(EKS) 용
# alloy.local.yaml 과 거의 같다. 실질 변경은 cluster 라벨과 메모리 상한뿐이다.
controller:
  type: daemonset

alloy:
  # ⚠️ 노드가 2대여도 켜지 않는다. clustering 은 메트릭 스크레이프 타겟을 나눌 때
  #    쓰는 기능인데, 우리는 로그만 다루고 아래 discovery 가 자기 노드만 본다.
  clustering:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 384Mi }   # 로컬 실측 117Mi. main 은 로그량이 많다
  configMap:
    content: |-
      // 1. 이 노드의 파드를 찾는다
      //
      // ⚠️ 이 필터가 틀리면 로그가 노드 수만큼 뻥튀기되거나 아예 안 온다.
      //    차트가 K8S_NODE_NAME 과 HOSTNAME 둘 다 spec.nodeName 으로 주입한다.
      discovery.kubernetes "pod" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("K8S_NODE_NAME"), sys.env("HOSTNAME"), constants.hostname)
        }
      }
      // 2. k8s 메타데이터를 Loki 라벨로 승격
      //
      // ⭐ app 을 app.kubernetes.io/name 에서 가져와야 메트릭의 job 라벨과 값이 같아진다.
      //    그래야 대시보드에서 메트릭 패널과 로그 패널을 변수 하나로 묶는다.
      // ⚠️ 라벨을 함부로 늘리지 말 것. Loki 는 라벨 조합마다 스트림을 만든다.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pod.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "replace"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          target_label  = "job"
        }
      }
      // 3. 컨테이너 로그를 읽는다 — k8s API 경유
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }
      // 4. 가공
      //
      // ⚠️ cluster 라벨이 로컬과 달라야 한다. 같으면 두 환경 로그가 한 스트림에 섞인다.
      // Spring Boot 3.3.5 라 구조화 로깅이 없다(3.4+ 필요). 생기면 stage.json 주석을 푼다.
      loki.process "pod_logs" {
        stage.static_labels {
          values = {
            cluster = "gamehouse-main",
          }
        }
        // stage.json {
        //   expressions = { level = "log.level", logger = "log.logger" }
        // }
        // stage.labels {
        //   values = { level = "" }
        // }
        forward_to = [loki.write.default.receiver]
      }
      // 5. Loki 로 보낸다 — gateway 를 안 켜므로 주소가 로컬과 같다
      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

# 로그가 안 들어오면 여기부터 확인:
#   kubectl auth can-i get pods/log --as=system:serviceaccount:observability:alloy
rbac:
  create: true
serviceAccount:
  create: true
serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: kps
