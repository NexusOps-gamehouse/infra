# ---------------------------------------------------------------------------
# Grafana Alloy — 파드 로그를 Loki 로 보낸다
#
# 나중에 Tempo 를 붙일 때 에이전트를 새로 깔지 않고 이 config 에
# otelcol.* 블록만 추가하면 된다. Fluent Bit 대신 Alloy 를 고른 이유다.
#
# gamehouse 는 event/ 기반 통신이 있어서 트레이싱이 생각보다 일찍 필요해진다.
# ---------------------------------------------------------------------------
controller:
  type: daemonset          # 로그 수집은 노드마다 하나

alloy:
  clustering:
    enabled: false         # kind 단일 노드

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

  configMap:
    content: |-
      // ===================================================================
      // 1. 이 노드의 파드를 찾는다
      //
      // field 셀렉터로 '자기 노드의 파드'만 본다. kind 단일 노드에서는
      // 티가 안 나지만, EKS 로 가면 이게 없을 때 로그가 노드 수만큼 뻥튀기된다.
      // ===================================================================
      discovery.kubernetes "pod" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      // ===================================================================
      // 2. k8s 메타데이터를 Loki 라벨로 승격
      //
      // ⭐ app 라벨을 app.kubernetes.io/name 에서 가져오는 것이 핵심이다.
      //    메트릭의 application 태그와 같은 값이 되므로, Grafana 에서
      //    메트릭 패널과 로그 패널이 같은 변수 하나로 묶인다.
      //
      // ⚠️ 기존 매니페스트의 라벨 규약을 확인할 것.
      //    app.kubernetes.io/name 을 안 쓰고 app: user 같은 걸 쓰고 있다면
      //    아래 __meta_kubernetes_pod_label_app 으로 바꿔야 한다.
      //
      // ⚠️ 라벨을 함부로 늘리지 말 것. Loki 는 라벨 조합마다 스트림을 만든다.
      // ===================================================================
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pod.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "replace"
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          target_label  = "job"
        }
      }

      // ===================================================================
      // 3. 컨테이너 로그를 읽는다
      //
      // loki.source.kubernetes 는 k8s API 로 읽는다. 호스트 경로를 마운트하는
      // loki.source.file 방식보다 권한이 단순하고 런타임 변화에 안 흔들린다.
      // ===================================================================
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      // ===================================================================
      // 4. 가공
      //
      // 지금은 정적 라벨만. common 에 structured logging 을 넣으면
      // 아래 stage.json 주석을 풀어 level 로 필터할 수 있게 된다.
      // ===================================================================
      loki.process "pod_logs" {
        stage.static_labels {
          values = {
            cluster = "gamehouse-local",
          }
        }

        // common 의 observability.yml 에 structured logging(ECS)을 켠 뒤 해제:
        // stage.json {
        //   expressions = { level = "log.level", logger = "log.logger" }
        // }
        // stage.labels {
        //   values = { level = "" }
        // }

        forward_to = [loki.write.default.receiver]
      }

      // ===================================================================
      // 5. Loki 로 보낸다
      //
      // ⚠️ 서비스 이름을 설치 후 반드시 확인:
      //      kubectl get svc -n observability | grep loki
      // ===================================================================
      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

# loki.source.kubernetes 는 pods/log 읽기 권한이 필요하다.
# 로그가 안 들어오면 여기부터 확인:
#   kubectl auth can-i get pods/log --as=system:serviceaccount:observability:alloy
rbac:
  create: true
serviceAccount:
  create: true

serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: kps