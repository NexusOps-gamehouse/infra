# ---------------------------------------------------------------------------
# kube-prometheus-stack — kind (gamehouse-local) 용
#
# 이 차트 하나에 다섯이 들어 있다:
#   Prometheus · Grafana · Alertmanager · node-exporter · kube-state-metrics
#
# ⚠️ 기존 metrics-server 와 충돌하지 않는다. 역할이 다르다.
#      metrics-server  HPA 용 실시간 값. 저장 안 함
#      Prometheus      시계열 저장. 그래프와 알람의 근거
# ---------------------------------------------------------------------------
fullnameOverride: kps

prometheus:
  prometheusSpec:
    # -----------------------------------------------------------------
    # ⭐ 이 네 줄이 없으면 우리가 Kustomize 로 만든 ServiceMonitor 를
    #    Prometheus 가 영원히 못 찾는다. 에러도 안 난다 — Targets 가 그냥 빈다.
    #    로컬에서 가장 많이 막히는 지점이다.
    # -----------------------------------------------------------------
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    # 기존 EC2 구성과 동일. 대시보드 쿼리의 rate() 창 계산이 그대로 유효해진다.
    scrapeInterval: 30s

    # k6 가 부하테스트 지표를 remote write 로 직접 밀어넣는다.
    # 이 값이 없으면 수신 엔드포인트(/api/v1/write)가 아예 열리지 않아
    # "10 load test" 대시보드의 k6 패널이 영구히 빈다. 에러는 k6 쪽에만 찍힌다.
    #
    # ⚠️ metric_relabel_configs 의 keep 은 remote write 에 적용되지 않는다.
    #    scrape_configs 안의 규칙이라서다. 회차 중 시계열이 계속 늘면
    #    Prometheus 메모리가 먼저 터진다. k6 쪽에서 줄인다:
    #      K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),count
    enableRemoteWriteReceiver: true

    retention: 24h
    retentionSize: 2GB

    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits:   { memory: 1Gi }

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

grafana:
  adminPassword: admin        # 로컬 전용

  # -----------------------------------------------------------------
  # kind 에는 NodePort 가 호스트로 안 뚫린다 (extraPortMappings 가 필요).
  # 클러스터 설정을 건드리지 않으려고 ClusterIP + port-forward 로 간다.
  #
  # ingress-nginx 가 이미 있으니 Ingress 로 열고 싶다면:
  #   echo "127.0.0.1 grafana.gamehouse.local" | sudo tee -a /etc/hosts
  # 하고 아래 ingress 블록의 enabled 를 true 로 바꾼다.
  # -----------------------------------------------------------------
  service:
    type: ClusterIP

  ingress:
    enabled: false
    ingressClassName: nginx
    hosts:
      - grafana.gamehouse.local
    path: /
    pathType: Prefix

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
    datasources:
      enabled: true
      searchNamespace: ALL

  # Loki 를 미리 등록해둔다. 없으면 Explore 에서 로그를 못 본다.
  # ⚠️ url 의 서비스 이름은 설치 후 확인할 것:
  #      kubectl get svc -n observability | grep loki
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      jsonData:
        maxLines: 1000

  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits:   { memory: 512Mi }


# ---------------------------------------------------------------------------
# ⭐ kind 에서 반드시 꺼야 하는 넷
#
# kind 는 kubeadm 기반이라 이 컨트롤 플레인 컴포넌트들이 127.0.0.1 에만
# 바인딩된다. Prometheus 가 못 긁고 Targets 에 빨간 DOWN 이 넷 남는다.
#
# 그대로 두면 "up 에 빨간 게 있는 게 정상"이라는 습관이 생기고,
# 진짜 장애 때 구분을 못 하게 된다. 로컬에서는 끄는 것이 맞다.
# (dev/prod overlay 에서는 EKS 관리형이라 애초에 안 보인다)
# ---------------------------------------------------------------------------
kubeEtcd:            { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler:       { enabled: false }
kubeProxy:           { enabled: false }

nodeExporter:        { enabled: true }
kube-state-metrics:  { enabled: true }

# ---------------------------------------------------------------------------
# Alertmanager — 알림 발송
#
# 기존 EC2 는 Grafana 가 알람 평가와 발송을 모두 했다. k8s 에서는 Prometheus 가
# 평가하고 Alertmanager 가 발송한다.
#
# ⚠️ 라우팅과 수신자는 여기(values)가 아니라 AlertmanagerConfig CR 에 있다.
#      k8s/components/observability/alertmanagerconfig-gamehouse.yaml
#
#    이유: webhook URL 은 그 자체가 비밀번호라 파일에 적으면 안 되는데,
#    values 의 alertmanager.config 에서 webhook_url_file 로 Secret 을 읽으려 하면
#    Prometheus Operator 가 거부한다 —
#      field webhook_url_file not found in type alertmanager.discordConfig
#    Operator 가 Alertmanager 설정을 자기 Go 구조체로 먼저 검증하기 때문이다.
#    Alertmanager 본체가 지원하는 필드라도 Operator 가 모르면 StatefulSet 이
#    아예 안 만들어진다. AlertmanagerConfig CR 은 apiURL 을 Secret 참조로 받는다.
#
# ⚠️ alertmanagerConfiguration 을 쓰면 그 CR 이 '전역 설정'이 된다.
#    values 에 config 를 같이 두면 안 된다. 둘 중 하나만 쓴다.
# ---------------------------------------------------------------------------
alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfiguration:
      name: gamehouse
      global:
        resolveTimeout: 5m
    resources:
      requests: { cpu: 25m, memory: 128Mi }
      limits:   { memory: 256Mi }
