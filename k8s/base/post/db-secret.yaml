# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
# ⚠️ placeholder — 실제 값은 절대 git 에 커밋하지 않는다.
# dev: overlays/dev 에서 개발용 더미값으로 patch.
# prod: 이 Secret 을 커밋하는 대신 External Secrets Operator 등으로 AWS Secrets Manager 에서
#        같은 이름(post-db-credentials)으로 동기화한다 (overlays/prod/external-secrets.yaml 참고).
apiVersion: v1
kind: Secret
metadata:
  name: post-db-credentials
  namespace: gamehouse
type: Opaque
stringData:
  DB_USERNAME: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
