# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: post-config
  namespace: gamehouse
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  ENV_NAME: "local"
  CORS_ALLOWED_ORIGINS: "https://gamehouse.example.com"
  DB_HOST: "CHANGE_ME-in-overlay"
  DB_PORT: "5432"
  DB_NAME: "duo"
