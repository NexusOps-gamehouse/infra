# ⚠️ placeholder — LLM_API_KEY 는 절대 git 에 커밋하지 않는다.
# dev/prod 는 components/aws 가 이 Secret 을 삭제하고 ExternalSecret 생성물로 대체한다.
# local 은 overlays/local/patches/secret-llm.yaml 이 dummy_key 로 덮어쓴다.
#
# 이 키가 dummy_key 면 ExplanationService 가 실제 호출을 건너뛰고 규칙 기반 문구로
# 대체한다(backend/match ExplanationService:86). 즉 키가 없어도 검색은 정상 동작하고
# AI 설명만 빠진다 — 파드는 뜨는데 기능만 조용히 죽는 형태라 알아채기 어렵다.
apiVersion: v1
kind: Secret
metadata:
  name: match-llm-secret
  namespace: gamehouse
type: Opaque
stringData:
  LLM_API_KEY: "CHANGE_ME"
