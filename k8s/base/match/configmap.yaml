# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: match-config
  namespace: gamehouse
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  # 실제로 호출하는 서비스만 넣는다. 여기 없는 주소는 NetworkPolicy 도 막혀 있다
  # (base/<svc>/networkpolicy.yaml 의 egress 와 짝을 이룬다).
  # 파드는 8081~8084 를 열지만 Service 가 targetPort 로 8080 에 매핑한다.
  USER_SERVICE_URL: "http://user:8080"
  # match 는 post 도 부른다 — PostClient(/api/posts), PostPartyClient(/internal/posts/party).
  # 이게 없으면 application.yml 의 기본값 http://localhost:8082 로 떨어지는데, 파드 안에는
  # 8082 가 없다. WebClient 는 최초 호출 시점에 연결하므로 기동·헬스체크는 다 통과하고
  # /api/match 검색을 때려야 그때 connection refused 로 죽는다.
  POST_SERVICE_URL: "http://post:8080"
  ENV_NAME: "local"
  CORS_ALLOWED_ORIGINS: "https://gamehouse.example.com"
  DB_PORT: "5432"
  DB_NAME: "duo"
