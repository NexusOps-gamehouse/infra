# k8s/base — 서비스(현재 5개) + rabbitmq + 네임스페이스 전역 정책/시크릿을 모두 모은다.
# overlays/local, overlays/dev, overlays/prod 가 각각 이 base 를 참조해 환경별 값을 patch 한다.
# dev/prod 는 EKS 공통 구성(components/aws)을 함께 include 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicy-baseline.yaml
  - jwt-secret.yaml
  - user
  - post
  - chat
  - riot
  - match
  # crew 는 backend 에 아직 모듈이 없다(settings.gradle 참고).
  # 매니페스트는 base/crew 에 그대로 있으니 코드가 생기면 아래 한 줄만 살리면 된다.
  # 이미지 없이 올려 두면 상시 ImagePullBackOff 가 되어, prod 에서 CI 누락을
  # 잡아내려고 만든 ImagePullBackOff 신호를 죽인다.
  # - crew
  - rabbitmq

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
