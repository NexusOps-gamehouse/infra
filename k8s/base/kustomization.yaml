# k8s/base — 6개 서비스 + rabbitmq + redis + 네임스페이스 전역 정책/시크릿을 모두 모은다.
# overlays/dev, overlays/prod 가 각각 이 base 를 참조해 환경별 값을 patch 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicy-baseline.yaml
  - jwt-secret.yaml
  - user
  - post
  - chat
  - match
  - crew
  - riot
  - rabbitmq
  - redis

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
