# k8s/base — 서비스(현재 6개) + rabbitmq + 네임스페이스 전역 정책/시크릿을 모두 모은다.
# overlays/local, overlays/dev, overlays/prod 가 각각 이 base 를 참조해 환경별 값을 patch 한다.
# dev/prod 는 EKS 공통 구성(components/aws)을 함께 include 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicy-baseline.yaml
  - jwt-secret.yaml
  - user
  - post
  - chat
  - riot
  - match
  - crew
  - rabbitmq

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
