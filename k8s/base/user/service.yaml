# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: user
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: mgmt
      port: 8180
      targetPort: mgmt
