# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: user
  # S3 로 전환하면 여기에 IRSA 를 붙인다 — 프로필 이미지 버킷 접근용.
  # 현재 업로드는 FileStorageService 가 로컬 디스크에 저장한다. 코드가 S3 를 쓰기
  # 전까지는 IAM 역할을 만들 이유가 없어 overlay 에 patch 를 두지 않는다.
  # 전환 시 automountServiceAccountToken: false 와 IRSA 토큰 주입이 함께 되는지
  # 확인한다.
  # ⚠️ 지금 방식은 replica 2 이상과 맞지 않는다 — 파일이 업로드를 받은 Pod 에만
  #    남아, 다른 Pod 로 간 조회 요청은 찾지 못한다. Pod 가 재시작하면 사라진다.
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/gamehouse-user-role
automountServiceAccountToken: false
