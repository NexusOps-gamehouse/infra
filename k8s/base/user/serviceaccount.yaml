# User 서비스 전용 ServiceAccount.
# Main EKS에서는 EKS Pod Identity association을 통해
# 프로필 이미지 S3 Presigned URL 생성에 필요한 IAM Role을 사용한다.
#
# Pod Identity는 ServiceAccount annotation에 IAM Role ARN을 기록하지 않는다.
# AWS 측 association:
#   cluster: gamehouse-main
#   namespace: gamehouse
#   serviceAccount: user
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: user
automountServiceAccountToken: false
