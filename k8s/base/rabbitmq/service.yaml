# 헤드리스 서비스 — StatefulSet 파드에 안정적인 DNS(rabbitmq-0.rabbitmq-headless)를 준다.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: stomp
      port: 61613
    - name: management
      port: 15672
    - name: metrics
      port: 15692
---
# 일반 ClusterIP 서비스 — 각 서비스는 이걸로 접근한다(rabbitmq.gamehouse.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: stomp
      port: 61613
    - name: management
      port: 15672
    - name: metrics
      port: 15692
