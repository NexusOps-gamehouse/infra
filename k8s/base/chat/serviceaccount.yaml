# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chat
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: chat
  # 이 서비스는 AWS 리소스에 직접 접근하지 않는다 — IRSA 불필요.
automountServiceAccountToken: false
