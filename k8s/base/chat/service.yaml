# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
apiVersion: v1
kind: Service
metadata:
  name: chat
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: chat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chat
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: mgmt
      port: 8081
      targetPort: mgmt
  # WebSocket(STOMP) 연결은 재협상 비용이 커서 같은 파드로 고정한다.
  # ALB/nginx 단에서도 sticky session(쿠키 기반)을 같이 켜는 걸 권장.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
