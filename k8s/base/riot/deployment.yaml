# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
# riot — 외부 API 게이트웨이
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riot
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: riot
    app.kubernetes.io/part-of: gamehouse
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: riot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riot
        app.kubernetes.io/part-of: gamehouse
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: riot
      # rabbitmq/redis 등 스테이트풀 의존성보다 먼저 뜨는 걸 막기 위해
      # 실제 기동 순서는 Spring 의 재시도(backoff)에 맡긴다 — initContainer 로
      # 강하게 막지 않는 이유는 순서 강제가 오히려 배포 시간을 늘리기 때문이다.
      containers:
        - name: riot
          image: nexusops0713/gamehouse-riot:develop
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: mgmt
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: riot-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: riot-config
                  key: SPRING_PROFILES_ACTIVE
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gamehouse-jwt
                  key: JWT_SECRET

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: riot-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: riot-config
                  key: REDIS_PORT

            - name: RIOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: riot-secret
                  key: RIOT_API_KEY

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: mgmt
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: mgmt
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: mgmt
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # UPLOAD_DIR(user/post) · 임시파일 쓰기 때문에 유지
            capabilities:
              drop: ["ALL"]
      securityContext:
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: riot
