# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
# riot — 외부 API 게이트웨이
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riot
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: riot
    app.kubernetes.io/part-of: gamehouse
# ⚠️ riot 은 수평 확장할 수 없다. RateLimiter(riot/service/RateLimiter.java) 가
# 프로세스 메모리 안의 창(window)으로 호출량을 세기 때문에, 파드가 N 개면 한도도
# N 배가 된다 — LIMIT=90 은 "파드당" 값이고 라이엇 개발용 키 한도는 2분당 100회다.
# 파드 3개면 2분당 270회를 통과시켜 키가 429/정지를 맞는다.
# 확장하려면 먼저 리미터를 파드 밖 공유 저장소 기반으로 바꿔야 한다 — RateLimiter
# 주석이 토큰 버킷을 제안한다. 그전까지 replicas 는 1 이고 HPA 는 붙이지 않는다.
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: riot
  # 다른 서비스와 달리 Recreate 다. RollingUpdate(maxSurge 1) 로 두면 롤아웃 중
  # 구/신 파드가 잠깐 공존하는데, 그동안 리미터가 2벌이 되어 2분당 180회까지
  # 통과시킨다 — 배포할 때마다 한도를 넘는다. riot 은 외부 노출이 없고 user 서비스만
  # 호출하므로, 롤아웃 중 짧은 공백을 감수하고 "항상 1벌" 을 지킨다.
  # 리미터가 파드 밖 공유 상태를 쓰게 되면 RollingUpdate 로 되돌린다.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riot
        app.kubernetes.io/part-of: gamehouse
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8184"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: riot
      # k8s 는 네임스페이스의 Service 마다 도커 링크 호환용 환경변수를 자동 주입한다
      # (rabbitmq Service → RABBITMQ_PORT=tcp://10.96.99.238:5672).
      # Spring 의 relaxed binding 이 이걸 rabbitmq.port 로 읽어버려
      # @Value("${rabbitmq.port}") int relayPort 가 int 변환에서 죽는다.
      # 환경변수는 application.yml 보다 우선순위가 높아 조용히 덮어쓴다.
      enableServiceLinks: false
      # rabbitmq 등 스테이트풀 의존성보다 먼저 뜨는 걸 막기 위해
      # 실제 기동 순서는 Spring 의 재시도(backoff)에 맡긴다 — initContainer 로
      # 강하게 막지 않는 이유는 순서 강제가 오히려 배포 시간을 늘리기 때문이다.
      containers:
        - name: riot
          # 논리 이름이다. 레지스트리 좌표가 아니다 — overlays 의 images: 가 실제 주소로 바꾼다.
          image: gamehouse-riot:OVERLAY_MUST_SET
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
            - name: mgmt
              containerPort: 8184
          envFrom:
            - configMapRef:
                name: riot-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: riot-config
                  key: SPRING_PROFILES_ACTIVE
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gamehouse-jwt
                  key: JWT_SECRET

            - name: RIOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: riot-secret
                  key: RIOT_API_KEY

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: mgmt
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: mgmt
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: mgmt
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999   # 이미지의 spring 계정(uid 999) — 이름으로는 kubelet 이 검증 못 한다
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # UPLOAD_DIR(user/post) · 임시파일 쓰기 때문에 유지
            capabilities:
              drop: ["ALL"]
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: riot
