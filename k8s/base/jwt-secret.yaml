# JWT_SECRET — user 가 발급하고, common/security(JwtAuthFilter)를 통해 나머지 5개 서비스가
# 검증한다. 발급/검증 양쪽이 반드시 같은 값을 봐야 하므로 서비스별로 쪼개지 않고
# 네임스페이스에 하나만 둔다.
#
# ⚠️ placeholder — 절대 git 에 실제 값 커밋 금지.
# local: overlays/local 에서 kind 전용 더미값으로 patch.
# dev/prod: External Secrets Operator 로 AWS Secrets Manager 의 값과 동기화
#       (components/aws/external-secrets/ 참고). 이 파일의 stringData 는
#       ExternalSecret 이 없을 때를 대비한 폴백 스캐폴딩일 뿐이다.
apiVersion: v1
kind: Secret
metadata:
  name: gamehouse-jwt
  namespace: gamehouse
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME-at-least-32-bytes"
