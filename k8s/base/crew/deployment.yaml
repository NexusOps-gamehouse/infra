# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
# crew — 크루 · 스케줄 · 거실 · 평가
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crew
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: crew
    app.kubernetes.io/part-of: gamehouse
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: crew
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crew
        app.kubernetes.io/part-of: gamehouse
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8186"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: crew
      # k8s 는 네임스페이스의 Service 마다 도커 링크 호환용 환경변수를 자동 주입한다
      # (rabbitmq Service → RABBITMQ_PORT=tcp://10.96.99.238:5672).
      # Spring 의 relaxed binding 이 이걸 rabbitmq.port 로 읽어버려
      # @Value("${rabbitmq.port}") int relayPort 가 int 변환에서 죽는다.
      # 환경변수는 application.yml 보다 우선순위가 높아 조용히 덮어쓴다.
      enableServiceLinks: false
      # rabbitmq 등 스테이트풀 의존성보다 먼저 뜨는 걸 막기 위해
      # 실제 기동 순서는 Spring 의 재시도(backoff)에 맡긴다 — initContainer 로
      # 강하게 막지 않는 이유는 순서 강제가 오히려 배포 시간을 늘리기 때문이다.
      containers:
        - name: crew
          # 논리 이름이다. 레지스트리 좌표가 아니다 — overlays 의 images: 가 실제 주소로 바꾼다.
          image: gamehouse-crew:OVERLAY_MUST_SET
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
            - name: mgmt
              containerPort: 8186
          envFrom:
            - configMapRef:
                name: crew-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: crew-config
                  key: SPRING_PROFILES_ACTIVE
            # DB_URL 이 $(DB_HOST) 를 치환하려면 그보다 먼저 선언돼 있어야 한다.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: crew-db-credentials
                  key: DB_HOST
            - name: DB_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?currentSchema=crew_svc"

            - name: CREW_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crew-db-credentials
                  key: DB_USERNAME
            - name: CREW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crew-db-credentials
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gamehouse-jwt
                  key: JWT_SECRET

            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: rabbitmq-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_AMQP_PORT
              valueFrom:
                configMapKeyRef:
                  name: rabbitmq-config
                  key: RABBITMQ_AMQP_PORT
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD

          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: mgmt
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: mgmt
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: mgmt
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999   # 이미지의 spring 계정(uid 999) — 이름으로는 kubelet 이 검증 못 한다
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # UPLOAD_DIR(user/post) · 임시파일 쓰기 때문에 유지
            capabilities:
              drop: ["ALL"]
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: crew
