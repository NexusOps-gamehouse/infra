# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: crew-config
  namespace: gamehouse
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  # 서비스 간 호출 주소가 하나도 없다. application.yml 의 services.*.base-url 은
  # 선언만 되어 있고 crew 코드에는 HTTP 클라이언트가 없다 — 넣어 두면 "부르고 있다"는
  # 오해만 남긴다. 호출이 생기면 여기와 networkpolicy.yaml 의 egress 를 같이 추가한다.
  ENV_NAME: "local"
  CORS_ALLOWED_ORIGINS: "https://gamehouse.example.com"
  DB_PORT: "5432"
  DB_NAME: "duo"
  # crew/client/UserClient — 닉네임 조회.
  # 이 줄이 없으면 application.yml 기본값 localhost:8081 로 떨어져
  # crew 가 자기 자신에게 붙으려다 실패하고 "사용자 #N" 으로 표시된다.
  USER_SERVICE_URL: "http://user:8080"