# 이 파일은 GameHouse MSA 설계 문서(디렉터리 구조 섹션 10)를 기준으로 생성되었다.
# 실제 값(이미지 태그, 리소스 상한, 시크릿)은 overlay 에서 환경별로 덮어쓴다.
apiVersion: v1
kind: Service
metadata:
  name: crew
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: crew
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crew
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: mgmt
      port: 8180
      targetPort: mgmt
  # House 채팅(/ws-house)이 WebSocket(STOMP)이라 chat 과 같은 이유로 파드를 고정한다.
  # 릴레이가 있어도 스티키는 여전히 의미가 있다 — 재협상 비용을 줄인다.
  # ALB/nginx 단에서도 sticky session(쿠키 기반)을 같이 켜는 걸 권장.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
