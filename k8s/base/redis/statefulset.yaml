# riot(레이트리미터 토큰버킷) · match(추천 캐시) · crew(라운지 온라인 현황)가 공유한다.
# 세 서비스 모두 "없어도 서비스가 죽지는 않는" 캐시성 데이터만 여기 둔다 — 영속 데이터 아님.
#
# ⚠️ prod 에서 ElastiCache(Redis)로 대체한다면 이 디렉터리(base/redis/) 전체를 삭제하고
# 각 서비스 ConfigMap 의 REDIS_HOST 를 ElastiCache 엔드포인트로 바꾸면 된다.
# 지금은 dev/prod 모두 in-cluster Redis 를 쓰는 것으로 시작한다 — 관리 부담이 적고
# ElastiCache 로 옮기는 전환이 코드 변경 없이 설정값만 바꾸면 되기 때문이다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: redis
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      serviceAccountName: redis
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --save
            - "60 100"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - "allkeys-lru"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "320Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
