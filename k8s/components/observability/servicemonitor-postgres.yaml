# postgres-exporter 수집.
# 기존 prometheus.yml 의 job_name: postgres (static_configs) 를 대체한다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/part-of: gamehouse
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  endpoints:
    - port: metrics                  # Service 의 포트 '이름'. 숫자를 쓰면 안 된다
      path: /metrics                 # exporter 기본값. actuator 와 다르다
      interval: 30s                  # 기존 EC2 구성과 동일 — rate() 창 계산이 그대로 유효
      # job 라벨을 'postgres' 로 고정한다.
      # 기본값은 Service 이름이라 그대로 두면 job="postgres-exporter" 가 되고,
      # 기존 대시보드·알람의 job="postgres" 쿼리가 전부 빈다.
      # Service 이름은 in-cluster postgres 와 겹칠 수 없어 postgres-exporter 로
      # 둘 수밖에 없었으므로, 라벨 쪽에서 맞춘다.
      relabelings:
        - targetLabel: job
          replacement: postgres
      # 기존 prometheus.yml 의 metric_relabel_configs 를 그대로 옮긴 것이다.
      # exporter 는 테이블·인덱스 단위로 지표를 쏟아낸다. 실제 쓰는 것만 남긴다.
      # 새 패널을 만들면서 "메트릭이 없다" 면 이 목록에 빠져 있는지 먼저 볼 것.
      #
      # pg_stat_user_tables_(seq_scan|idx_scan) 은 개선 전후 비교용이다.
      # ⚠️ 이 값으로 N+1 을 '판정' 하지 않는다 — DB 전역이라 어느 엔드포인트가
      #    훑었는지 구분되지 않고, PG 15+ 는 통계를 최대 10초 뒤에 넘긴다.
      #
      # ⚠️ 기존 EC2 와 달라지는 점: local 은 한 DB(duo) 안에 user_svc / post_svc /
      #    chat_svc / match_svc 스키마가 갈려 있다. pg_stat_user_tables_* 에
      #    schemaname 라벨이 여러 값으로 붙으므로 시계열이 스키마 수만큼 늘어난다.
      #    기존 대시보드 쿼리가 스키마를 합산하지 않으면 선이 여러 개로 갈린다.
      #
      # up 은 Prometheus 가 생성하는 합성 지표라 이 keep 에 걸리지 않는다.
      # "관측 수집 중단" 알람은 그대로 동작한다.
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'pg_up|pg_settings_max_connections|pg_stat_database_(numbackends|blks_hit|blks_read|xact_commit|xact_rollback|deadlocks)|pg_stat_activity_max_tx_duration|pg_database_size_bytes|pg_stat_user_tables_(seq_scan|idx_scan)'
          action: keep
