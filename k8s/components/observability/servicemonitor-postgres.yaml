# postgres-exporter 수집.
# 기존 prometheus.yml 의 job_name: postgres (static_configs) 를 대체한다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/part-of: gamehouse
    release: kps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  endpoints:
    - port: metrics                  # Service 의 포트 '이름'. 숫자를 쓰면 안 된다
      path: /metrics                 # exporter 기본값. actuator 와 다르다
      interval: 30s                  # 기존 EC2 구성과 동일 — rate() 창 계산이 그대로 유효
      # job 을 'postgres' 로 고정한다. 기본값은 Service 이름이라
      # job="postgres-exporter" 가 되고 기존 대시보드·알람 쿼리가 전부 빈다.
      relabelings:
        - targetLabel: job
          replacement: postgres
      # exporter 는 테이블·인덱스 단위로 지표를 쏟아낸다. 실제 쓰는 것만 남긴다.
      # ⚠️ 새 패널에서 "메트릭이 없다" 면 이 목록에 빠져 있는지 먼저 볼 것.
      # ⚠️ pg_stat_user_tables_* 는 스키마마다 시계열이 갈린다 (user_svc · post_svc …).
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'pg_up|pg_settings_max_connections|pg_stat_database_(numbackends|blks_hit|blks_read|xact_commit|xact_rollback|deadlocks)|pg_stat_activity_max_tx_duration|pg_database_size_bytes|pg_stat_user_tables_(seq_scan|idx_scan)'
          action: keep
