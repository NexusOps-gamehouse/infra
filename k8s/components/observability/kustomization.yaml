# 관측 배선 Component.
#
# components/aws 와 같은 패턴이다. base 는 건드리지 않고 overlay 에서 골라 붙인다.
#
# ⚠️ base 가 아니라 component 로 둔 이유:
#    ServiceMonitor 는 Prometheus Operator 의 CRD 다. 그 CRD 가 없는 클러스터에
#    apply 하면 "no matches for kind ServiceMonitor" 로 통째로 실패한다.
#    dev/prod EKS 에 kube-prometheus-stack 을 아직 안 깔았다면 거기서 터진다.
#    그래서 관측 스택이 있는 환경의 overlay 만 이 component 를 포함한다.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - servicemonitor-user.yaml
  - servicemonitor-post.yaml
  - servicemonitor-chat.yaml
  - servicemonitor-match.yaml
  - servicemonitor-riot.yaml
  - podmonitor-rabbitmq.yaml
  - postgres-exporter.yaml
  - servicemonitor-postgres.yaml
  - prometheusrule-gamehouse.yaml
  - alertmanagerconfig-gamehouse.yaml
  # crew 는 base/kustomization.yaml 에서 빠져 있으므로 여기도 없다.
  # 배포 대상에 들어오면 servicemonitor-crew.yaml 을 만들어 추가한다.

configMapGenerator:
  # 대시보드 JSON 을 ConfigMap 으로 만들면 Grafana sidecar 가 자동으로 읽어 간다.
  # sidecar 는 이미 켜져 있다 — LABEL=grafana_dashboard, LABEL_VALUE=1, NAMESPACE=ALL.
  #
  # disableNameSuffixHash 를 켜는 이유:
  #   기본값은 내용 해시를 이름 뒤에 붙이는 것이라, 대시보드를 고칠 때마다
  #   ConfigMap 이름이 바뀌고 옛 것이 클러스터에 남는다. apply 로는 안 지워진다.
  #   sidecar 가 둘 다 읽어 같은 uid 의 대시보드가 두 벌이 된다.
  - name: grafana-dashboard-gamehouse-overview
    namespace: gamehouse
    files:
      - dashboards/gamehouse-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: gamehouse


  - name: grafana-dashboard-k6-load-test
    namespace: gamehouse
    files:
      - dashboards/k6-load-test.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: gamehouse
