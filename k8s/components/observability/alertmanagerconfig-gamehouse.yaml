# Alertmanager 라우팅과 수신자.
# Prometheus 가 평가하고 Alertmanager 가 발송한다.
#
# ⚠️ values 의 alertmanager.config 가 아니라 이 CR 을 쓰는 이유:
#    webhook URL 은 그 자체가 비밀번호라 파일에 적으면 안 되는데, values 에서
#    Secret 을 읽으려 하면 Operator 가 자기 Go 구조체로 검증하며 거부한다
#    (field webhook_url_file not found). 그러면 StatefulSet 이 아예 안 만들어지고
#    CR 의 status 와 Operator 로그에만 이유가 남는다.
#    AlertmanagerConfig 는 apiURL 을 Secret 참조로 받는다.
#
# Secret 은 명령형으로 만든다 (git 에 안 들어간다):
#   kubectl -n observability create secret generic discord-webhook --from-literal=url=...
# dev/prod 는 External Secrets 로 같은 이름의 Secret 을 만들면 이 파일을 그대로 쓴다.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: gamehouse
  namespace: observability
  labels:
    app.kubernetes.io/name: gamehouse
    app.kubernetes.io/part-of: gamehouse
spec:
  route:
    # ⚠️ 기본 receiver 가 'null' 이다 — 아무 데도 안 보낸다.
    #    Alertmanager 를 켜면 kube-prometheus-stack 기본 규칙 134건도 전부 발송
    #    대상이 된다. 그대로 두면 첫날부터 소음이 쏟아지고, 그러다 알림을 통째로
    #    꺼버리게 된다. origin="gamehouse" 가 붙은 우리 알람만 내보낸다.
    #
    #    ⚠️ main 에서는 기본 규칙 중 31개를 살려야 한다. KubePodCrashLooping ·
    #       KubeNodeNotReady 처럼 운영에서 꼭 필요한 것이 있다. 선별 목록은 별도 문서.
    receiver: 'null'
    # alertname 으로 묶는다. job 을 빼서 여러 서비스가 동시에 죽으면 메시지 하나에 다 들어온다.
    groupBy: ['alertname']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    # ⚠️ routes 는 위에서부터 먼저 맞는 것 하나만 적용된다. 순서가 곧 우선순위다.
    routes:
      # Watchdog 은 파이프라인 생존 확인용이라 '일부러 항상 울린다'. 발송하면 안 된다.
      - receiver: 'null'
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
      - receiver: 'null'
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: "="
      # Riot 키 만료를 맨 위에 둔다.
      # 개발용 키가 24시간마다 만료돼 사실상 매일 울린다. 처음 한 번은 바로 알리되
      # 반복만 6시간으로 늦춘다. 다른 critical 처럼 1시간마다 오면 알림을 꺼버리게 된다.
      - receiver: discord
        matchers:
          - name: origin
            value: gamehouse
            matchType: "="
          - name: alertname
            value: RiotApiKeyRejected
            matchType: "="
        groupWait: 30s
        groupInterval: 30m
        repeatInterval: 6h
      # 즉시 대응이 필요한 것
      - receiver: discord
        matchers:
          - name: origin
            value: gamehouse
            matchType: "="
          - name: severity
            value: critical
            matchType: "="
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 1h
      # 관측 스택 저하 등. 서비스는 정상이므로 하루 한 번이면 충분하다.
      - receiver: discord
        matchers:
          - name: origin
            value: gamehouse
            matchType: "="
          - name: severity
            value: warning
            matchType: "="
        groupWait: 5m
        groupInterval: 30m
        repeatInterval: 24h
  receivers:
    # 아무것도 보내지 않는 수신자. 이름이 'null' 인 문자열이어야 한다.
    - name: 'null'
    - name: discord
      discordConfigs:
        # URL 을 Secret 에서 읽는다. 이 파일에는 남지 않는다.
        - apiURL:
            name: discord-webhook
            key: url
          sendResolved: true
          # PrometheusRule 의 annotations 가 여기로 들어온다.
          title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
          message: |
            {{ range .Alerts }}
            **{{ .Annotations.summary }}**
            {{ .Annotations.description }}
            {{ end }}
