# AWS Secrets Manager 의 gamehouse/prod/jwt 시크릿(JSON) 을 15분마다 동기화해
# k8s Secret `gamehouse-jwt` 을(를) 채운다. 키 이름은 Deployment 의 secretKeyRef 와 맞춰야 한다.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gamehouse-jwt
  namespace: gamehouse
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gamehouse-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gamehouse-jwt
    creationPolicy: Owner
  data:
      - secretKey: JWT_SECRET
        remoteRef:
          key: gamehouse/prod/jwt
          property: JWT_SECRET
