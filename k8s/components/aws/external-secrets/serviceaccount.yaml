# ESO 가 AWS Secrets Manager 를 읽을 때 쓰는 ServiceAccount(IRSA).
# ⚠️ role-arn 은 각 오버레이의 patches/serviceaccount-external-secrets.yaml 이 채운다
#    — dev / prod 는 서로 다른 IAM 역할을 써야 한다(dev 역할이 prod 시크릿을 읽으면 안 된다).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: gamehouse
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_IN_OVERLAY
