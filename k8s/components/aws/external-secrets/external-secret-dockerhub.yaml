# 도커허브 비공개 레포에서 이미지를 당기기 위한 pull 자격증명.
# 경로의 `ENV` 세그먼트는 각 오버레이의 `replacements` 가 dev/prod 로 치환한다
# (오버레이의 gamehouse-env ConfigMap 이 소스). 치환이 안 되면 SecretSyncedError 로 드러난다.
#
# 다른 ExternalSecret 과 달리 `template` 을 쓴다. imagePullSecrets 는 평범한 key/value
# Secret 이 아니라 `kubernetes.io/dockerconfigjson` 타입이어야 하고, 그 안에 도커 설정
# JSON 이 통째로 들어가야 하기 때문이다. Secrets Manager 에는 USERNAME/PASSWORD 두 키만
# 넣어 두고, JSON 조립은 여기서 한다.
#
# ⚠️ CI 가 쓰는 push 토큰과 같은 값을 쓰지 말 것. 이건 pull 전용이며, 도커허브에서
#    read-only 액세스 토큰을 따로 발급해 넣는다.
#
# 전제: AWS Secrets Manager 에 아래 시크릿 두 개를 등록해 둔다.
#   gamehouse/dev/dockerhub    { "USERNAME": "...", "PASSWORD": "<read-only 액세스 토큰>" }
#   gamehouse/prod/dockerhub   { "USERNAME": "...", "PASSWORD": "<read-only 액세스 토큰>" }
#
# 아래 key: 의 `ENV` 는 자리표시자 표기가 아니라 파일에 실제로 들어 있는 글자다.
# 빌드할 때 오버레이의 replacements 가 dev/prod 로 바꾼다 — 손대지 말 것.
# 각 오버레이가 실제로 찾는 이름은 이렇게 확인한다:
#   kubectl kustomize k8s/overlays/dev | grep 'key: gamehouse/'
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dockerhub
  namespace: gamehouse
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gamehouse-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: dockerhub
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"https://index.docker.io/v1/":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: gamehouse/ENV/dockerhub
        property: USERNAME
    - secretKey: password
      remoteRef:
        key: gamehouse/ENV/dockerhub
        property: PASSWORD
