# AWS Secrets Manager 의 gamehouse/ENV/db/chat 시크릿(JSON) 을 15분마다 동기화해
# k8s Secret `chat-db-credentials` 을(를) 채운다. 키 이름은 Deployment 의 secretKeyRef 와 맞춰야 한다.
# 경로의 `ENV` 세그먼트는 각 오버레이의 `replacements` 가 dev/prod 로 치환한다
# (오버레이의 gamehouse-env ConfigMap 이 소스). 치환이 안 되면 SecretSyncedError 로 드러난다.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: chat-db-credentials
  namespace: gamehouse
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gamehouse-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: chat-db-credentials
    creationPolicy: Owner
  data:
      # RDS 엔드포인트도 여기서 받는다. ConfigMap 에 두면 저장소에 남아
      # AWS 계정 식별자·리전·인스턴스명이 드러난다(자격증명은 아니지만 정찰 정보다).
      - secretKey: DB_HOST
        remoteRef:
          key: gamehouse/ENV/db/chat
          property: DB_HOST
      - secretKey: DB_USERNAME
        remoteRef:
          key: gamehouse/ENV/db/chat
          property: DB_USERNAME
      - secretKey: DB_PASSWORD
        remoteRef:
          key: gamehouse/ENV/db/chat
          property: DB_PASSWORD
