# AWS Secrets Manager 의 gamehouse/ENV/db/chat 시크릿(JSON) 을 15분마다 동기화해
# k8s Secret `chat-db-credentials` 을(를) 채운다. 키 이름은 Deployment 의 secretKeyRef 와 맞춰야 한다.
# 경로의 `ENV` 세그먼트는 각 오버레이의 `replacements` 가 dev/prod 로 치환한다
# (오버레이의 gamehouse-env ConfigMap 이 소스). 치환이 안 되면 SecretSyncedError 로 드러난다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-db-credentials
  namespace: gamehouse
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gamehouse-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: chat-db-credentials
    creationPolicy: Owner
  data:
      # RDS 엔드포인트도 여기서 받는다. 자격증명은 아니지만 ConfigMap 에 두지 않는다 —
      # 이건 "접속 가능한 대상 주소"라서, 보안그룹이 잘못 열린 순간 바로 찔러볼 수 있는
      # 값이다. 인스턴스명도 함께 드러난다.
      #
      # 계정 ID 를 가리려는 목적은 아니다. 그건 어차피 오버레이의 IRSA·ACM ARN 에
      # 그대로 적힌다(overlays/<env>/patches/serviceaccount-external-secrets.yaml).
      - secretKey: DB_HOST
        remoteRef:
          key: gamehouse/ENV/db/chat
          property: DB_HOST
      - secretKey: DB_USERNAME
        remoteRef:
          key: gamehouse/ENV/db/chat
          property: DB_USERNAME
      - secretKey: DB_PASSWORD
        remoteRef:
          key: gamehouse/ENV/db/chat
          property: DB_PASSWORD
