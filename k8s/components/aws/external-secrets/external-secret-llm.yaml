# AWS Secrets Manager 의 gamehouse/<env>/llm 에서 LLM_API_KEY 를 가져온다.
# ENV 세그먼트는 오버레이의 replacements 가 dev/prod 로 치환한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: match-llm-secret
  namespace: gamehouse
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gamehouse-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: match-llm-secret
    creationPolicy: Owner
  data:
      - secretKey: LLM_API_KEY
        remoteRef:
          key: gamehouse/ENV/llm
          property: LLM_API_KEY
