# AWS Secrets Manager 의 gamehouse/ENV/riot 시크릿(JSON) 을 15분마다 동기화해
# k8s Secret `riot-secret` 을(를) 채운다. 키 이름은 Deployment 의 secretKeyRef 와 맞춰야 한다.
# 경로의 `ENV` 세그먼트는 각 오버레이의 `replacements` 가 dev/prod 로 치환한다
# (오버레이의 gamehouse-env ConfigMap 이 소스). 치환이 안 되면 SecretSyncedError 로 드러난다.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: riot-secret
  namespace: gamehouse
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gamehouse-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: riot-secret
    creationPolicy: Owner
  data:
      - secretKey: RIOT_API_KEY
        remoteRef:
          key: gamehouse/ENV/riot
          property: RIOT_API_KEY
