# dev/prod 는 비공개 도커허브 레포에서 이미지를 당긴다 — pull 자격증명이 필요하다.
# Deployment 마다 붙이지 않고 ServiceAccount 에 붙인다: 그 SA 를 쓰는 파드가 자동으로
# 상속하므로 워크로드 종류(Deployment/StatefulSet/Job)가 늘어도 여기만 보면 된다.
#
# automountServiceAccountToken: false 와 무관하다 — 그건 파드 안에 API 토큰을 마운트할지
# 여부고, imagePullSecrets 는 kubelet 이 이미지를 당길 때 별도로 읽는다.
#
# local(kind) 에는 이 패치가 없다. `kind load` 로 노드에 이미지를 직접 넣으므로
# 레지스트리 인증이 필요 없다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  namespace: gamehouse
imagePullSecrets:
  - name: dockerhub
