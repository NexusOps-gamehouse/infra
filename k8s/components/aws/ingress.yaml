# EKS + AWS Load Balancer Controller(ALB). dev / prod 공통.
# frontend 는 없다 — S3+CloudFront 가 정적 자산을 서빙하고, CloudFront가 /api·/ws 만
# 이 ALB(오리진)로 넘긴다. 그래서 overlays/local/ingress.yaml 에 있던 "/" → frontend
# 규칙이 여기엔 없다.
#
# 환경별로 오버레이가 patches/ingress.yaml 로 채우는 것:
#   - certificate-arn  (환경별 ACM 인증서)
#   - group.name       (환경마다 달라야 한다 — 같은 AWS 계정에서 이름이 겹치면
#                       dev/prod 두 클러스터의 LB 컨트롤러가 ALB 하나를 서로
#                       덮어쓴다. 서비스 5개가 ALB 를 공유하는 건 그대로다 —
#                       서비스마다 ALB 를 새로 만들면 시간당 비용이 5배가 된다.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamehouse
  namespace: gamehouse
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # ⚠️ 오버레이가 환경별 이름으로 덮어쓴다(gamehouse-dev / gamehouse-prod).
    alb.ingress.kubernetes.io/group.name: REPLACE_IN_OVERLAY
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # ⚠️ 오버레이가 환경별 ACM 인증서 ARN 으로 덮어쓴다.
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_IN_OVERLAY
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    # target-type=ip 에서 Service 의 이름 있는 포트 `mgmt`가 각 Pod의 실제
    # management targetPort(8181, 8182, 8183 ...)로 해석된다.
    alb.ingress.kubernetes.io/healthcheck-port: "mgmt"
    # chat 은 WebSocket(STOMP) 이라 유휴 타임아웃을 늘린다 — 기본 60s 면 끊긴다.
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=false,deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/users
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/friends
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/notifications
            pathType: Prefix
            backend:
              service: { name: user, port: { number: 8080 } }
          - path: /api/posts
            pathType: Prefix
            backend:
              service: { name: post, port: { number: 8080 } }
          - path: /api/applications
            pathType: Prefix
            backend:
              service: { name: post, port: { number: 8080 } }
          # 이름과 달리 user 가 아니라 post 소유다 — PostController 의 /api/my/posts,
          # ApplicationController 의 /api/my/applications ("내가 쓴 글/지원 내역").
          - path: /api/my
            pathType: Prefix
            backend:
              service: { name: post, port: { number: 8080 } }
          - path: /api/chat
            pathType: Prefix
            backend:
              service: { name: chat, port: { number: 8080 } }
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: chat, port: { number: 8080 } }
          - path: /api/match
            pathType: Prefix
            backend:
              service: { name: match, port: { number: 8080 } }
          # crew — base/kustomization.yaml 에서 제외됨. 되살릴 때 같이 푼다.
          # ⚠️ Service 없이 규칙만 남겨 두면 안 된다. AWS Load Balancer Controller 는
          #    Ingress 를 통째로 하나의 모델로 만들기 때문에, 백엔드 Service 가 하나라도
          #    없으면 FailedBuildModel 로 reconcile 자체가 멈춘다 — 해당 경로만 죽는 게
          #    아니라 ALB 가 안 뜨거나 이후 규칙 갱신이 전부 막힌다.
          #    ingress-nginx(local) 는 없는 백엔드를 그 경로만 503 으로 흘려보내므로
          #    local 에서는 끝까지 드러나지 않는다.
          # - path: /api/crews
          #   pathType: Prefix
          #   backend:
          #     service: { name: crew, port: { number: 8080 } }
          # riot 은 외부 노출 없음 — 의도적으로 경로가 없다.
