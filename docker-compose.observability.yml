name: gamehouse-observe

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: gamehouse-cadvisor
    command: ["--docker_only=true"]
    ports:
      - "127.0.0.1:18086:8080"      # 8080은 backend가 쓰므로 18086으로
    volumes:                        # 컨테이너 정보를 읽을 통로들
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro                #   ← CPU/메모리 실제 수치
      - /var/lib/docker/:/var/lib/docker:ro   # ← 컨테이너 이름
    privileged: true
    restart: unless-stopped
    networks: [observe-net]

  # 호스트 층. cAdvisor 는 컨테이너 안만 보므로 "EC2 디스크가 꽉 찼다" 같은
  # 장애는 절대 잡히지 않는다. 도커 이미지와 로그가 조용히 쌓이다 서비스 전체를
  # 멈추게 하는 실전 1순위 원인이라 서버가 한 대일수록 더 필요하다.
  #
  # command 와 volumes 는 짝이다. 컨테이너에도 자기 자신의 /proc, /sys 가 있어
  # 그냥 읽으면 호스트가 아닌 컨테이너 정보를 읽는다. 그래서 호스트 쪽을
  # /host/* 라는 다른 이름으로 넣고, --path.* 로 그쪽을 보라고 알려준다.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: gamehouse-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
    ports:
      - "127.0.0.1:19100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    restart: unless-stopped
    networks: [observe-net]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gamehouse-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 보관 기간과 용량을 명시한다. 암묵 기본값에 맡기면 EC2 디스크가
      # 언제 차는지 예측할 수 없다. 둘 중 먼저 도달하는 쪽이 적용된다.
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      # prometheus.yml 의 external_labels 에서 ${ENV_NAME} 치환을 허용한다.
      # (Prometheus 설정 파일은 기본적으로 환경변수를 확장하지 않는다)
      - --enable-feature=expand-external-labels
    environment:
      ENV_NAME: ${ENV_NAME:-local}
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus       # 없으면 재시작 시 기록 소실
    restart: unless-stopped
    networks:
      - observe-net
      # backend(:8081/actuator/prometheus) 와 rabbitmq(:15692) 를 수집하려면
      # gamehouse 스택의 네트워크에도 합류해야 한다.
      # 기존 docker-compose.yml 은 수정하지 않고, 이미 만들어진 network 를
      # external 로 가져다 쓴다. 이름 규칙은 {project}_{network} = gamehouse_backend-net.
      # backend 는 frontend-net / backend-net 양쪽에, rabbitmq 는 backend-net 에 있으므로
      # backend-net 하나만 붙으면 둘 다 닿는다.
      - gamehouse_backend-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: gamehouse-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?required}
      # 로그인 없이 보는 것을 명시적으로 차단. 외부에 열 때 필수.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 로그인 화면에서 회원가입 링크 제거
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # 기본값 127.0.0.1 = 호스트 내부 전용(로컬 개발용, 안전한 기본값).
      # 외부에서 브라우저로 접근해야 하는 서버(EC2)에서만 .env 에
      # GRAFANA_BIND=0.0.0.0 을 넣고, 보안그룹에서 13000 을 특정 IP 로만 연다.
      #
      # ⚠️ Prometheus(19090) / cAdvisor(18086) / node-exporter(19100) 는
      #    인증이 없으므로 절대 같은 방식으로 열지 말 것.
      #    Grafana 만 로그인 화면이 있어 노출해도 되는 유일한 서비스다.
      - "${GRAFANA_BIND:-127.0.0.1}:13000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks: [observe-net]

  # DB 층. RDS 안에서 본 상태를 수집한다.
  #
  # HikariCP 패널이 '앱에서 본' 시야라면 이쪽은 'DB에서 본' 시야다.
  # 둘을 겹쳐야 커넥션이 밀릴 때 풀이 작은 건지 DB 가 한계인지 갈린다.
  #   대기 높음 + DB 연결 수 낮음 → 풀이 작다
  #   대기 높음 + DB 연결 수 최대 → DB 가 한계
  #
  # DB 가 RDS 로 빠지면서 cAdvisor 로 보이던 gamehouse-db 컨테이너가 사라졌다.
  # 그 빈자리를 메우는 것이 이 exporter 다.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: gamehouse-postgres-exporter
    environment:
      # URI / USER / PASS 를 나눠 준다.
      # 하나의 접속 문자열(DATA_SOURCE_NAME)로 합치면 비밀번호에 @ # / 같은 문자가
      # 섞였을 때 URL 인코딩이 필요해지고, 안 하면 조용히 접속 실패한다.
      #
      # 주소는 앱과 같은 RDS 를 그대로 재사용한다(DB_HOST/DB_PORT/DB_NAME).
      # sslmode=require 는 RDS 가 SSL 접속을 강제하므로 반드시 필요하다.
      DATA_SOURCE_URI: "${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require"
      # 앱 계정이 아니라 읽기 전용 계정을 쓴다. pg_monitor 권한만 있으면 되고,
      # 이 계정으로는 테이블 데이터를 볼 수 없다(.env.example 의 생성 SQL 참고).
      DATA_SOURCE_USER: ${PG_EXPORTER_USERNAME:-exporter}
      DATA_SOURCE_PASS: ${PG_EXPORTER_PASSWORD:?PG_EXPORTER_PASSWORD is required}
    ports:
      # ⚠️ 인증이 없다. Prometheus / cAdvisor 와 같은 취급으로,
      #    127.0.0.1 에만 묶고 절대 외부에 열지 않는다.
      - "127.0.0.1:19187:9187"
    restart: unless-stopped
    # RDS 는 도커 네트워크 밖이라 호스트를 거쳐 나간다.
    # Prometheus 가 긁어갈 수 있도록 observe-net 에만 붙이면 된다.
    networks: [observe-net]

networks:
  observe-net:
    driver: bridge
  gamehouse_backend-net:
    external: true      # gamehouse 스택이 만든 network (먼저 떠 있어야 한다)

volumes:
  prom-data:
  grafana-data: