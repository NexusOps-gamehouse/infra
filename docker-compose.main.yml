name: gamehouse-main

services:

  # ================================================================
  # RabbitMQ
  # AMQP 5672  : 서비스 간 이벤트
  # STOMP 61613: Chat WebSocket relay
  # 외부에는 공개하지 않는다.
  # ================================================================
  rabbitmq:
    build: ./rabbitmq
    container_name: gamehouse-main-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - backend-net

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  # ================================================================
  # User Service
  # App 8081 / Actuator 8181
  # DB: user_svc / duo_user
  # ================================================================
  user:
    image: nexusops0713/gamehouse:user-main
    platform: linux/amd64
    pull_policy: always
    container_name: gamehouse-main-user

    depends_on:
      rabbitmq:
        condition: service_healthy

    environment:
      MALLOC_ARENA_MAX: "2"

      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      USER_DB_USERNAME: ${USER_DB_USERNAME:?USER_DB_USERNAME is required}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      UPLOAD_DIR: /app/uploads

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_AMQP_PORT: ${RABBITMQ_AMQP_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

      USER_SERVICE_URL: http://user:8081
      POST_SERVICE_URL: http://post:8082
      CHAT_SERVICE_URL: http://chat:8083
      RIOT_SERVICE_URL: http://riot:8084

      AWS_REGION: ${AWS_REGION}
      PROFILE_IMAGE_BUCKET: ${PROFILE_IMAGE_BUCKET}

    volumes:
      - backend-uploads:/app/uploads

    networks:
      - backend-net

    ports:
      - "8081:8081"
      - "8181:8181"

    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

    restart: unless-stopped


  # ================================================================
  # Post Service
  # App 8082 / Actuator 8182
  # DB: post_svc / duo_post
  # ================================================================
  post:
    image: nexusops0713/gamehouse:post-main
    platform: linux/amd64
    pull_policy: always
    container_name: gamehouse-main-post

    depends_on:
      rabbitmq:
        condition: service_healthy

    environment:
      MALLOC_ARENA_MAX: "2"

      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      POST_DB_USERNAME: ${POST_DB_USERNAME:?POST_DB_USERNAME is required}
      POST_DB_PASSWORD: ${POST_DB_PASSWORD:?POST_DB_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_AMQP_PORT: ${RABBITMQ_AMQP_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

      USER_SERVICE_URL: http://user:8081
      POST_SERVICE_URL: http://post:8082
      CHAT_SERVICE_URL: http://chat:8083
      RIOT_SERVICE_URL: http://riot:8084

    networks:
      - backend-net

    ports:
      - "8082:8082"
      - "8182:8182"

    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

    restart: unless-stopped


  # ================================================================
  # Chat Service
  # App 8083 / Actuator 8183
  # DB: chat_svc / duo_chat
  # ================================================================
  chat:
    image: nexusops0713/gamehouse:chat-main
    platform: linux/amd64
    pull_policy: always
    container_name: gamehouse-main-chat

    depends_on:
      rabbitmq:
        condition: service_healthy

    environment:
      MALLOC_ARENA_MAX: "2"

      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      CHAT_DB_USERNAME: ${CHAT_DB_USERNAME:?CHAT_DB_USERNAME is required}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?CHAT_DB_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_AMQP_PORT: ${RABBITMQ_AMQP_PORT:-5672}
      RABBITMQ_STOMP_PORT: ${RABBITMQ_STOMP_PORT:-61613}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

      USER_SERVICE_URL: http://user:8081
      POST_SERVICE_URL: http://post:8082
      CHAT_SERVICE_URL: http://chat:8083
      RIOT_SERVICE_URL: http://riot:8084

    networks:
      - backend-net

    ports:
      - "8083:8083"
      - "8183:8183"

    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

    restart: unless-stopped


  # ================================================================
  # Riot Service
  # App 8084 / Actuator 8184
  # DB / RabbitMQ 사용하지 않음
  # ================================================================
  riot:
    image: nexusops0713/gamehouse:riot-main
    platform: linux/amd64
    pull_policy: always
    container_name: gamehouse-main-riot

    environment:
      MALLOC_ARENA_MAX: "2"

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      RIOT_API_KEY: ${RIOT_API_KEY:?RIOT_API_KEY is required}

      USER_SERVICE_URL: http://user:8081
      POST_SERVICE_URL: http://post:8082
      CHAT_SERVICE_URL: http://chat:8083
      RIOT_SERVICE_URL: http://riot:8084

    networks:
      - backend-net

    ports:
      - "8084:8084"
      - "8184:8184"

    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

    restart: unless-stopped


  # ================================================================
  # Match Service
  # App 8085 / Actuator 8185
  # DB: match_svc / duo_match
  # ================================================================
  match:
    image: nexusops0713/gamehouse:match-main
    platform: linux/amd64
    pull_policy: always
    container_name: gamehouse-main-match

    depends_on:
      rabbitmq:
        condition: service_healthy

    environment:
      MALLOC_ARENA_MAX: "2"

      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      MATCH_DB_USERNAME: ${MATCH_DB_USERNAME:?MATCH_DB_USERNAME is required}
      MATCH_DB_PASSWORD: ${MATCH_DB_PASSWORD:?MATCH_DB_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_AMQP_PORT: ${RABBITMQ_AMQP_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

      USER_SERVICE_URL: http://user:8081
      POST_SERVICE_URL: http://post:8082
      CHAT_SERVICE_URL: http://chat:8083
      RIOT_SERVICE_URL: http://riot:8084

    networks:
      - backend-net

    ports:
      - "8085:8085"
      - "8185:8185"

    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

    restart: unless-stopped


networks:
  backend-net:
    driver: bridge


volumes:
  backend-uploads:
  rabbitmq-data: