name: gamehouse

services:
  # 채팅 메시지 전달을 위한 STOMP 브로커.
  # 외부에 공개하지 않고 backend-net을 통해 Backend에서만 접근한다.
  rabbitmq:
    build: ../infra/rabbitmq
    container_name: gamehouse-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - backend-net

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  backend:
    build: ../backend
    image: nexusops0713/gamehouse:backend-${BACKEND_VERSION:-main}

    platform: linux/amd64

    # main 태그가 갱신될 수 있으므로 실행 시 registry의 이미지를 확인한다.
    pull_policy: always

    container_name: gamehouse-backend

    depends_on:
      rabbitmq:
        condition: service_healthy

    environment:
      # ---- JVM 메모리 제한 -----------------------------------------------
      MALLOC_ARENA_MAX: "2"
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:MaxDirectMemorySize=64m"

      # ---- Main RDS ------------------------------------------------------
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME:-duo}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      # ---- Application ---------------------------------------------------
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /app/uploads
      RIOT_API_KEY: ${RIOT_API_KEY:?RIOT_API_KEY is required}

      # ---- RabbitMQ ------------------------------------------------------
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_STOMP_PORT: 61613
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-appuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

    volumes:
      - backend-uploads:/app/uploads

    networks:
      - backend-net

    ports:
      # ALB → EC2:8080 → Backend Container:8080
      - "8080:8080"

      # EC2 내부에서 Actuator 확인용
      - "127.0.0.1:8081:8081"

    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s


# Backend ↔ RabbitMQ 내부 통신용 네트워크
networks:
  backend-net:
    driver: bridge


volumes:
  backend-uploads:
  rabbitmq-data: